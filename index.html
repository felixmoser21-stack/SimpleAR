<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AR Home Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* Video Container */
        #video-container {
            position: fixed;
            top: -60px;
            left: 0;
            width: 100vw;
            height: calc(100vh + 60px);
            display: none;
        }

        #home-video {
            width: 100vw;
            height: calc(100vh + 60px);
            object-fit: cover;
            position: fixed;
            top: -60px;
            left: 0;
        }

        /* Video is clickable */
        #video-container {
            cursor: pointer;
        }

        #home-video {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Video Container -->
    <div id="video-container">
        <video id="home-video" autoplay muted loop playsinline preload="auto">
            <source src="HOME_SCREEN.mp4" type="video/mp4">
        </video>
    </div>
<script src="orientation-handler.js"></script>

    <script>
        // Elements
        const videoContainer = document.getElementById('video-container');
        const homeVideo = document.getElementById('home-video');

        // Check if device is in landscape mode
        function isLandscape() {
            return window.innerWidth > window.innerHeight;
        }

        // Request fullscreen
        function requestFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen(); // Chrome, Firefox, Opera
            } else if (elem.webkitRequestFullscreen) { // Safari, older Chrome
                elem.webkitRequestFullscreen();
            } else if (elem.mozRequestFullScreen) { // Older Firefox
                elem.mozRequestFullScreen();
            } else if (elem.msRequestFullscreen) { // IE/Edge
                elem.msRequestFullscreen();
            }
        }

        // Handle orientation change - Zeige Video in JEDER Orientierung
        function handleOrientation() {
            videoContainer.style.display = 'block';
            
            // Start video if not already playing
            homeVideo.play().catch(err => {
                console.log('Video autoplay prevented:', err);
            });
            
            // Request fullscreen to hide Safari UI
            requestFullscreen();
        }

        // Handle video click - redirect to QR scanner first
        videoContainer.addEventListener('click', function() {
            console.log('Video clicked - redirecting to QR scanner...');
            // Redirect to QR scanner page
            window.location.href = 'qr-scanner.html';
        });

        // Initialize on page load
        function init() {
            // Check initial orientation
            handleOrientation();

            // Listen for orientation changes
            window.addEventListener('orientationchange', handleOrientation);
            window.addEventListener('resize', handleOrientation);

            // Force video to start loading
            homeVideo.load();
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
