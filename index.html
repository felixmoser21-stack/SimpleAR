<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AR Home Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* Video Container */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
        }

        #home-video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Wrong Orientation Overlay */
        #wrong-orientation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #wrong-orientation img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        /* Video is clickable */
        #video-container {
            cursor: pointer;
        }

        #home-video {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Wrong Orientation Overlay -->
    <div id="wrong-orientation">
        <img src="WRONG_ORIENTATION.png" alt="Bitte Handy drehen">
    </div>

    <!-- Video Container -->
    <div id="video-container">
        <video id="home-video" autoplay muted loop playsinline preload="auto">
            <source src="HOME_SCREEN.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        // Elements
        const wrongOrientationOverlay = document.getElementById('wrong-orientation');
        const videoContainer = document.getElementById('video-container');
        const homeVideo = document.getElementById('home-video');

        // Check if device is in landscape mode
        function isLandscape() {
            return window.innerWidth > window.innerHeight;
        }

        // Request fullscreen
        function requestFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen(); // Chrome, Firefox, Opera
            } else if (elem.webkitRequestFullscreen) { // Safari, older Chrome
                elem.webkitRequestFullscreen();
            } else if (elem.mozRequestFullScreen) { // Older Firefox
                elem.mozRequestFullScreen();
            } else if (elem.msRequestFullscreen) { // IE/Edge
                elem.msRequestFullscreen();
            }
        }

        // Handle orientation change
        function handleOrientation() {
            if (isLandscape()) {
                // Landscape mode - show video
                wrongOrientationOverlay.style.display = 'none';
                videoContainer.style.display = 'block';

                // Start video if not already playing
                homeVideo.play().catch(err => {
                    console.log('Video autoplay prevented:', err);
                });

                // Request fullscreen to hide Safari UI
                requestFullscreen();
            } else {
                // Portrait mode - show wrong orientation overlay
                wrongOrientationOverlay.style.display = 'flex';
                videoContainer.style.display = 'none';
            }
        }

        // Handle video click - redirect to tracker with autostart parameter
        videoContainer.addEventListener('click', function() {
            console.log('Video clicked - redirecting to AR tracker...');
            // Redirect to index_tracker.html with autostart parameter
            window.location.href = 'index_tracker.html?autostart=true';
        });

        // Initialize on page load
        function init() {
            // Check initial orientation
            handleOrientation();

            // Listen for orientation changes
            window.addEventListener('orientationchange', handleOrientation);
            window.addEventListener('resize', handleOrientation);

            // Force video to start loading
            homeVideo.load();
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
