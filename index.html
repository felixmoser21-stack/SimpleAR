<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AR Home Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        /* Video Container */
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        #home-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Wrong Orientation Overlay */
        #wrong-orientation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #wrong-orientation img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Video is clickable */
        #video-container {
            cursor: pointer;
        }

        #home-video {
            pointer-events: none;
        }

        /* Unity Loading Overlay */
        #unity-loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        #unity-loading-content {
            text-align: center;
            color: white;
        }

        #unity-loading-content h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        /* Loading Spinner */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Fade animations */
        .fade-out {
            animation: fadeOut 0.5s ease forwards;
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Wrong Orientation Overlay -->
    <div id="wrong-orientation">
        <img src="WRONG_ORIENTATION.png" alt="Bitte Handy drehen">
    </div>

    <!-- Video Container -->
    <div id="video-container">
        <video id="home-video" autoplay muted loop playsinline preload="auto">
            <source src="HOME_SCREEN.mp4" type="video/mp4">
        </video>
    </div>

    
    <!-- Unity Loading Overlay -->
    <div id="unity-loading-overlay">
        <div id="unity-loading-content">
            <h2>Unity lädt jetzt...</h2>
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        // Elements
        const wrongOrientationOverlay = document.getElementById('wrong-orientation');
        const videoContainer = document.getElementById('video-container');
        const homeVideo = document.getElementById('home-video');
        const unityLoadingOverlay = document.getElementById('unity-loading-overlay');

        // Check if device is in landscape mode
        function isLandscape() {
            return window.innerWidth > window.innerHeight;
        }

        
        // Handle orientation change
        function handleOrientation() {
            if (isLandscape()) {
                // Landscape mode - show video
                wrongOrientationOverlay.style.display = 'none';
                videoContainer.style.display = 'block';

                // Start video if not already playing
                homeVideo.play().catch(err => {
                    console.log('Video autoplay prevented:', err);
                });
            } else {
                // Portrait mode - show wrong orientation overlay
                wrongOrientationOverlay.style.display = 'flex';
                videoContainer.style.display = 'none';
            }
        }

        // Handle video click to start AR
        videoContainer.addEventListener('click', function() {
            // Show Unity loading overlay
            unityLoadingOverlay.style.display = 'flex';

            // Pause video to save resources
            homeVideo.pause();

            // TODO: Hier später Unity-WebGL-Loader starten oder zu unity-index.html weiterleiten
            // Beispiel:
            // window.location.href = "unity-index.html?station=1";
            
            console.log('Video clicked - Unity loading...');
        });

        // Initialize on page load
        function init() {
            // Check initial orientation
            handleOrientation();

            // Listen for orientation changes
            window.addEventListener('orientationchange', handleOrientation);
            window.addEventListener('resize', handleOrientation);

            // Force video to start loading
            homeVideo.load();
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
