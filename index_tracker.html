<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, height=device-height, initial-scale=1.0,
                   minimum-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity WebGL Player | Storiis</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html {
            height: -webkit-fill-available;
        }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            width: 100vw;
            overflow: hidden;
        }
        .ctaDiv {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background: #fffa;
            z-index: 99;
        }

        /* AR-Video-Canvas darf keine Klicks fangen */
        #video-canvas {
            pointer-events: none;
        }

        /* Unity-Canvas nach vorne holen */
        #unity-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
        }

        /* HTML Back-Button als Fallback für Unity UI */
        #html-back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        #html-back-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        #html-back-button:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }

        /* Wrong Orientation Overlay */
        #wrong-orientation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        #wrong-orientation img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        @media screen and (orientation: landscape) {
            #wrong-orientation {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- Wrong Orientation Overlay -->
    <div id="wrong-orientation">
        <img src="WRONG_ORIENTATION.png" alt="Bitte Handy drehen">
    </div>

    <!--IMAGETARGETS-->
    <imagetarget id="bear"   src="targets/bear.png"></imagetarget>
    <imagetarget id="bfly"   src="targets/bfly.png"></imagetarget>
    <imagetarget id="flower" src="targets/flower.png"></imagetarget>
    <imagetarget id="lady"   src="targets/lady.png"></imagetarget>
    <imagetarget id="reel"   src="targets/reel.png"></imagetarget>
    <imagetarget id="rmn"    src="targets/rmn.png"></imagetarget>

    <video id="webcam-video" muted autoplay playsinline
           style="width:1px;position:absolute"></video>
    <canvas id="video-canvas"
            style="width:100%; height:100%; object-fit:cover; position:absolute"></canvas>

    <div id="startARDiv" class="ctaDiv">
        <select id="chooseCamSel" style="display: none;" onchange="SelectCam()"></select>
        <p style="text-align: center; width:60vw;">
            This augmented reality experience requires access to your device's camera
        </p>
        <button id="startARButton" onclick="StartAR()" style="display:none">
            ALLOW ACCESS
        </button>
    </div>

    <div id="screenshotDiv" style="display: none;" class="ctaDiv">
        <div style="position:relative; background-color:white; padding:10px;
                    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3),
                                0 6px 20px 0 rgba(0, 0, 0, 0.25);">
            <img id="screenshotImg" src="" alt="screenshot"
                 style="width:80vw; height:80vh">
            <button onclick="document.getElementById('screenshotDiv').style.display = 'none';"
                    style="position:absolute; transform:translateY(-100%); right:0; top:0">
                Close
            </button>
        </div>
    </div>

    <div id="confirmUrlDiv" style="display: none;" class="ctaDiv">
        <div style="position:relative; background-color:white; padding:10px;
                    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3),
                                0 6px 20px 0 rgba(0, 0, 0, 0.25);
                    width: 80vw; display:flex; flex-direction: column; align-items: center;">
            <p id="confirmUrlText"
               style="text-align: center; width:80%; overflow: hidden; text-overflow: ellipsis;">
                Are you sure you want to visit url.com?
            </p>
            <div>
                <button onclick="window.open(newUrlString, '_blank').focus();
                                 document.getElementById('confirmUrlDiv').style.display = 'none'">
                    VISIT SITE
                </button>
                <button onclick="document.getElementById('confirmUrlDiv').style.display = 'none'">
                    GO BACK
                </button>
            </div>
        </div>
    </div>

    <div id="errorDiv" class="ctaDiv" style="display: none; background:#aaa">
        <p id="errorText" style="text-align: center; width:60vw; color:white"></p>
    </div>

    <!-- HTML Back-Button -->
    <button id="html-back-button"
            onclick="BackToScanner()"
            style="display:none;"
            title="Zurück zum Scanner">
        ←
    </button>

    <div id="unity-container" class="unity-mobile">
        <canvas id="unity-canvas"
                style="width: 100%; height: 100%; background: #0000; z-index: 100"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>

    <!-- Imagine / Unity Scripts -->
    <script src="arcamera.js" type="text/javascript"></script>
    <script src="itracker.js" type="text/javascript"></script>
    <!-- Loader ist NICHT gz-komprimiert -->
    <script src="Build/ZOO.loader.js"></script>

    <script>
        var initialize = async () => {
            var unityCanvas = document.querySelector("#unity-canvas");
            var videoCanvas = document.querySelector("#video-canvas");
            window.arCamera = new ARCamera(unityCanvas, videoCanvas);
            window.iTracker = new ImageTracker(arCamera);
            try {
                await window.iTracker.initialize("./opencv.js");
                console.log("ImageTracker initialized!");
            } catch (error) {
                console.error("Failed to initialize ImageTracker. Are you missing opencv.js? ", error);
                ShowError("Failed to initialize the experience.");
                return;
            }

            await LoadWebcams();
            document.getElementById("startARButton").style.display = "block";
            window.permissionsGranted = IsCameraPermissionGranted();
        };
        initialize();

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");

        function StartAR() {
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";

            document.getElementById("startARDiv").style.display = "none";

            createUnityInstance(
                document.querySelector("#unity-canvas"),
                {
                    /* WICHTIG: GZIP-Dateien */
                    dataUrl:      "Build/ZOO.data.gz",
                    frameworkUrl: "Build/ZOO.framework.js.gz",
                    codeUrl:      "Build/ZOO.wasm.gz",
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "Storiis",
                    productName: "Storiis",
                    productVersion: "2.0.0",
                    // webglContextAttributes: { "preserveDrawingBuffer": true },
                    // matchWebGLToCanvasSize: false,
                    // devicePixelRatio: 1,
                },
                (progress) => {
                    progressBarFull.style.width = 100 * progress + "%";
                }
            ).then((unityInstance) => {
                window.unityInstance = unityInstance;
                if (window.permissionsGranted)
                    RequestWebcam();
                loadingBar.style.display = "none";

                var htmlBackBtn = document.getElementById("html-back-button");
                if (htmlBackBtn) {
                    htmlBackBtn.style.display = "flex";
                    console.log("[HTML] Back-Button aktiviert");
                }
            });

            loadingBar.style.display = "block";
        }

        //Set Facing Mode here ('environment', 'user', '')
        window.unityFacingMode = "environment";
        window.WEBCAM_SETTINGS = {
            video: {
                facingMode: unityFacingMode,
            },
            audio: false
        };
        window.requestingForPermissions = false;

        async function RequestWebcam() {
            window.requestingForPermissions = true;
            try {
                window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                console.log("Webcam access granted");
                requestingForPermissions = false;
                StopWebcam();
            } catch (err) {
                console.error("getUserMedia error - ", err);
                ShowError("Failed to start the experience. Camera permission was denied");
                window.requestingForPermissions = false;
            }
        }

        function StopWebcam() {
            console.log("stopping camera");
            if (!window.webcamStream) return;
            window.webcamStream.getTracks().forEach(track => track.stop());
        }

        async function StartWebcam() {
            console.log("StartWebcam");
            window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
            while (window.requestingForPermissions) {
                console.log("Waiting for permissions...");
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            console.log("Got Permissions");
            if (window.webcamStream) {
                const video = document.querySelector("#webcam-video");
                video.srcObject = webcamStream;
                try {
                    await arCamera.startWebcam(video);
                    console.log("Webcam started successfully");
                    window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamSuccess');
                } catch (err) {
                    console.error("Webcam failed to start - ", err);
                    window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
                }
            } else {
                console.error("Webcam failed to start - permission not yet granted");
                window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
            }
        }

        async function LoadWebcams() {
            let camDevices = [];
            let devices = await navigator.mediaDevices.enumerateDevices();
            devices.forEach(mediaDevice => {
                if (mediaDevice.kind === 'videoinput') {
                    if (window.unityFacingMode == 'environment' &&
                        !mediaDevice.label.includes('facing front')) {
                        camDevices.push(mediaDevice);
                    } else if (window.unityFacingMode == 'user' &&
                               mediaDevice.label.includes('facing front')) {
                        camDevices.push(mediaDevice);
                    } else {
                        camDevices.push(mediaDevice);
                    }
                }
            });

            var select = document.getElementById("chooseCamSel");
            select.style.display = "block";
            camDevices = camDevices.reverse();
            let count = 0;
            camDevices.forEach(mediaDevice => {
                const option = document.createElement('option');
                option.value = mediaDevice.deviceId;
                let label = `Camera ${count}`;
                if (mediaDevice.label) {
                    label = mediaDevice.label;
                }
                option.appendChild(document.createTextNode(label));
                select.appendChild(option);
                count++;
            });
            iTracker.WEBCAM_NAME = select.options[select.selectedIndex].innerHTML;
        }

        function SelectCam() {
            var select = document.getElementById("chooseCamSel");
            window.deviceId = select.value;
            window.WEBCAM_SETTINGS.video['deviceId'] = deviceId;
            iTracker.WEBCAM_NAME = select.options[select.selectedIndex].innerHTML;
        }

        async function FlipCam() {
            arCamera.stopWebcam();
            window.WEBCAM_SETTINGS.video.deviceId = '';
            if (window.WEBCAM_SETTINGS.video.facingMode == 'user') {
                window.WEBCAM_SETTINGS.video.facingMode = 'environment';
                arCamera.setFlipped(false);
            } else {
                window.WEBCAM_SETTINGS.video.facingMode = 'user';
                arCamera.setFlipped(true);
            }
            window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
            const video = document.querySelector("#webcam-video");
            video.srcObject = webcamStream;
            await arCamera.startWebcam(video);
        }

        async function IsCameraPermissionGranted() {
            if (!navigator.permissions || !navigator.mediaDevices) {
                console.log("Permissions API or mediaDevices not supported.");
                return false;
            }
            try {
                const permissionStatus = await navigator.permissions.query({ name: "camera" });
                if (permissionStatus.state === "granted") {
                    console.log("Camera permission has already been granted.");
                    return true;
                } else if (permissionStatus.state === "prompt") {
                    console.log("Camera permission is promptable.");
                    return false;
                } else {
                    console.log("Camera permission has been denied.");
                    return false;
                }
            } catch (error) {
                console.log("Error checking camera permission:", error);
                return false;
            }
        }

        function ShowError(error) {
            document.getElementById("errorDiv").style.display = "flex";
            document.getElementById("errorText").innerHTML = error;
        }

        function ShowScreenshot(dataUrl) {
            document.getElementById("screenshotDiv").style.display = "flex";
            document.getElementById("screenshotImg").src = dataUrl;
            document.getElementById("screenshotImg").style.width = "80vw";
            document.getElementById("screenshotImg").style.height =
                80 / window.innerWidth * window.innerHeight + "vw";
        }

        function ShowConfirmUrl(url) {
            document.getElementById("confirmUrlDiv").style.display = "flex";
            window.newUrlString = url;
            document.getElementById("confirmUrlText").innerText =
                "Are you sure you want to visit " + url;
        }

        function BackToScanner() {
            console.log("BackToScanner called from Unity");

            try {
                if (window.arCamera && typeof window.arCamera.stopWebcam === "function") {
                    window.arCamera.stopWebcam();
                }
            } catch (e) {
                console.warn("Could not stop arCamera webcam:", e);
            }

            try {
                if (window.webcamStream) {
                    window.webcamStream.getTracks().forEach(track => track.stop());
                    window.webcamStream = null;
                    console.log("Webcam stream stopped.");
                }
            } catch (e) {
                console.warn("Could not stop webcamStream:", e);
            }

            if (window.unityInstance && typeof window.unityInstance.Quit === "function") {
                try {
                    window.unityInstance.Quit().then(function () {
                        console.log("Unity quit finished, going back to qr-scanner.html");
                        window.unityInstance = null;
                        window.location.href = "qr-scanner.html";
                    }).catch(function (err) {
                        console.warn("Unity Quit failed:", err);
                        window.location.href = "qr-scanner.html";
                    });
                    return;
                } catch (e) {
                    console.warn("Error during Unity Quit:", e);
                    window.location.href = "qr-scanner.html";
                    return;
                }
            }

            window.location.href = "qr-scanner.html";
        }

        window.ITRACKER_GLOBALS = {
            INTERNAL_SMOOTHFACTOR_POS: .075,
        };

        // --- Orientation Handling (wie bei dir) ---
        function isLandscape() {
            return window.innerWidth > window.innerHeight;
        }

        let wasInLandscape = isLandscape();
        let trackerWasPaused = false;

        function pauseTracker() {
            console.log('[Orientation] Pausing iTracker for portrait mode...');
            if (window.iTracker && window.iTracker.isStarted) {
                try {
                    window.iTracker.onStartResize();
                    trackerWasPaused = true;
                    console.log('[Orientation] ✓ ImageTracker paused');
                } catch (e) {
                    console.warn('[Orientation] Could not pause iTracker:', e);
                }
            }
        }

        function resumeTracker() {
            console.log('[Orientation] Resuming iTracker for landscape mode...');
            if (window.iTracker && trackerWasPaused) {
                try {
                    window.iTracker.onFinishedResize();
                    trackerWasPaused = false;
                    console.log('[Orientation] ✓ ImageTracker resumed');
                } catch (e) {
                    console.warn('[Orientation] Could not resume iTracker:', e);
                }
            }
            if (canvas) {
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
            }
        }

        function handleOrientationChange() {
            const nowLandscape = isLandscape();
            if (wasInLandscape && !nowLandscape) {
                console.log('[Orientation] Changed to PORTRAIT - pausing tracker...');
                pauseTracker();
            } else if (!wasInLandscape && nowLandscape) {
                console.log('[Orientation] Changed to LANDSCAPE - resuming tracker...');
                resumeTracker();
            }
            wasInLandscape = nowLandscape;
        }

        window.addEventListener('orientationchange', function () {
            setTimeout(handleOrientationChange, 100);
        });

        window.addEventListener('resize', function () {
            clearTimeout(window._orientationResizeTimeout);
            window._orientationResizeTimeout = setTimeout(handleOrientationChange, 200);
        });

        if (screen.orientation) {
            screen.orientation.addEventListener('change', function () {
                setTimeout(handleOrientationChange, 100);
            });
        }

        window.addEventListener('load', function () {
            if (!isLandscape()) {
                console.log('[Orientation] Started in portrait mode - tracker will start paused');
                setTimeout(function () {
                    if (!isLandscape() && window.iTracker) {
                        pauseTracker();
                    }
                }, 2000);
            }
        });
    </script>

    <script src="autostart.js"></script>
</body>
</html>
