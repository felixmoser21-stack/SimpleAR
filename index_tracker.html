<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport"
          content="width=device-width, height=device-height, initial-scale=1.0,
                   minimum-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity WebGL Player | Storiis</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <!-- Offizielles Unity-Template-CSS -->
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">

    <style>
        html {
            height: -webkit-fill-available;
        }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            width: 100vw;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            letter-spacing: 0.05em;
            font-size: max(2vw, 2vh);
            /* Weißer Hintergrund */
            background: #ffffff;
            color: #000000;
        }

        button {
            height: max(5vw, 5vh);
            font-size: max(2vw, 2vh);
            font-weight: bold;
            border-radius: max(1.5vw, 1.5vh);
            padding-left: max(5vw, 5vh);
            padding-right: max(5vw, 5vh);
            border: 0;
            color: #62a7fe;
            background: #3d3d3d;
            transition: 0.1s;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        button:hover { filter: brightness(1.15); }
        button:active { transform: scale(0.95); filter: brightness(0.85); }

        .ctaDiv {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background: #2f2e32aa;
            z-index: 99;
            transition: 0.5s;
        }

        @keyframes spin {
            0%   { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); }
        }

        /* AR-Container + Canvas viewportfüllend */
        #unity-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #ffffff; /* weißer Hintergrund */
        }

        #video-canvas,
        #unity-canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            display: block !important;
            transform: none !important;
            -webkit-transform: none !important;
            image-orientation: from-image !important;
            zoom: 1 !important;
            scale: 1 !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
        }

        #video-canvas {
            pointer-events: none;
            -webkit-appearance: none;
            -webkit-user-select: none;
        }

        #unity-canvas {
            z-index: 100;
            background: transparent !important;
        }

        /* HTML Back-Button als Fallback für Unity UI */
        #html-back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid white;
            border-radius: 50% !important;
            width: 50px !important;
            height: 50px !important;
            min-width: 50px !important;
            min-height: 50px !important;
            padding: 0 !important;
            font-size: 24px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        #html-back-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        #html-back-button:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }

        /* ==== Ladebildschirm auf Basis der offiziellen TemplateData-Assets ==== */

        /* Wrapper für Logo + Progressbar */
        #unity-loading-bar {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none; /* wird von JS auf "block" gesetzt */
            z-index: 500;
            text-align: center;
        }

        /* Unity-Logo: Verwendung von TemplateData/unity-logo-light.png
           (dunkles Logo für hellen Hintergrund) */
        #unity-logo {
            width: 154px;
            height: 130px;
            margin: 0 auto 20px auto;
            background: url('TemplateData/unity-logo-light.png') no-repeat center;
            background-size: contain;
        }

        /* Leer-Balken (Rahmen) – offizielles PNG */
        #unity-progress-bar-empty {
            width: 141px;
            height: 18px;
            margin: 0 auto;
            background: url('TemplateData/progress-bar-empty-light.png') no-repeat center;
            background-size: contain;
        }

        /* Gefüllter Balken – offizielles PNG, Breite wird per JS geändert */
        #unity-progress-bar-full {
            width: 0%;
            height: 18px;
            margin-top: -18px;
            background: url('TemplateData/progress-bar-full-light.png') no-repeat left center;
            background-size: auto 100%;
        }

        /* Warnbanner – schwarze Schrift auf weißem Hintergrund */
        #unity-warning {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 90vw;
            background: #ffffff;
            color: #000000;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 600;
            display: none;
        }
    </style>
</head>
<body>
    <!--IMAGETARGETS-->
    <imagetarget id="flower"      src="targets/flower.png"></imagetarget>
    <imagetarget id="Zoo_Tracker" src="targets/Zoo_Tracker.png"></imagetarget>

    <video id="webcam-video" muted autoplay playsinline
           style="width:1px;position:absolute"></video>
    <canvas id="video-canvas"
            style="width:100%; height:100%; object-fit:cover;"></canvas>

    <div id="startARDiv" class="ctaDiv" style="background:#2f2e32">
        <select id="chooseCamSel"
                style="display: none; background: transparent; border: .05vh solid white;
                       border-radius: max(0.5vw, 0.5vh); color:white;
                       font-size: max(1.5vw, 1.5vh); position: absolute; bottom: 80px"
                onchange="SelectCam()"></select>
        <p style="text-align: center; width:min(60vw, 60vh);">
            This augmented reality experience requires access to your device's camera
        </p>
        <button id="startARButton" onclick="StartAR()" style="visibility:hidden">
            ALLOW ACCESS
        </button>
        <div id="spinner"
             style="position: absolute; left: 50%; bottom: 40%; transform: translateX(-50%);
                    border: 5px solid rgba(255,255,255,0.2); border-top: 5px solid white;
                    border-radius: 50%; width: 50px; height: 50px;
                    animation: spin 1s linear infinite;">
        </div>
        <br><br><br>
    </div>

    <div id="screenshotDiv" style="display: none; opacity: 0;" class="ctaDiv">
        <div style="position:relative; background-color:#2c2b2f;
                    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3),
                                0 6px 20px 0 rgba(0, 0, 0, 0.25);
                    border-radius: max(1.5vh, 1.5vw);
                    text-align: center; overflow: hidden">
          <img id="screenshotImg" src="" alt="screenshot" style="width:80vw; height:80vh">
          <button onclick="HideScreenshot()"
                  style="position:absolute;right: max(1vw, 1vh);top: max(1vw, 1vh);
                         background: #3d3d3d77; width: max(4vw, 4vh); height: max(4vw, 4vh);
                         padding: 0;border-radius: 100vw; display: flex;
                         align-items: center;justify-content: center;">
            <svg width="max(2.5vw,2.5vh)" height="max(2.5vw,2.5vh)" viewBox="0 0 24 24">
              <line x1="3" y1="3" x2="21" y2="21" stroke="#999" stroke-width="2.5"></line>
              <line x1="3" y1="21" x2="21" y2="3" stroke="#999" stroke-width="2.5"></line>
            </svg>
          </button>
          <p style="font-size: max(1vw, 1vh); color: #fff6">
              Press and hold to save or share this screenshot
          </p>
        </div>
    </div>

    <div id="confirmUrlDiv" style="display: none; opacity: 0;" class="ctaDiv">
        <div style="position:relative; background-color:#2c2b2f; padding:10px;
                    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3),
                                0 6px 20px 0 rgba(0, 0, 0, 0.25);
                    width: min(80vw,80vh); display:flex; flex-direction: column;
                    align-items: center; border-radius: 1.5vh;">
            <p id="confirmUrlText"
               style="text-align: center; width:80%; overflow: hidden; text-overflow: ellipsis;">
                Are you sure you want to visit url.com?
            </p>
            <div style="width: 100%">
                <button style="width: 100%; margin-bottom: 15px;"
                        onclick="window.open(newUrlString, '_blank').focus(); HideConfirmUrl()">
                    VISIT SITE
                </button>
                <button style="width: 100%" onclick="HideConfirmUrl()">
                    GO BACK
                </button>
            </div>
        </div>
    </div>

    <div id="errorDiv" class="ctaDiv"
         style="display: none; opacity: 0; background-color:#2c2b2f">
        <p id="errorText"
           style="text-align: center; width:60vw; color:#7f3f3f; font-size: max(3vw, 3vh);">
        </p>
    </div>

    <!-- HTML Back-Button -->
    <button id="html-back-button"
            onclick="BackToScanner()"
            title="Zurück zum Scanner">
        ←
    </button>

    <div id="unity-container" class="unity-mobile">
        <canvas id="unity-canvas" width="720" height="1280" tabindex="-1"
                style="background:transparent;"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
    </div>

    <!-- Imagine / Unity Scripts -->
    <script src="arcamera.js" type="text/javascript"></script>
    <script src="itracker.js" type="text/javascript"></script>
	<script src="orientation-handler.js"></script>

    <script>
      // Disable double-tap to zoom
      document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
          event.preventDefault();
        }
      }, { passive: false });

      // Disable pinch to zoom
      document.addEventListener('gesturestart', function (event) {
        event.preventDefault();
      });

      var initialize = async () => {
        var unityCanvas = document.querySelector("#unity-canvas");
        var videoCanvas = document.querySelector("#video-canvas");
        window.arCamera  = new ARCamera(unityCanvas, videoCanvas);
        window.iTracker  = new ImageTracker(arCamera);

        try {
          await window.iTracker.initialize("./opencv.js");
          console.log("ImageTracker initialized!");
        } catch (error) {
          console.error("Failed to initialize ImageTracker. Are you missing opencv.js? ", error);
          ShowError("Failed to initialize the experience.");
          return;
        }

        await LoadWebcams();

        document.getElementById("startARButton").style.visibility = "visible";
        document.getElementById("spinner").style.visibility     = "hidden";

        window.permissionsGranted = IsCameraPermissionGranted();
      };
      initialize();

      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container       = document.querySelector("#unity-container");
      var canvas          = document.querySelector("#unity-canvas");
      var loadingBar      = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner   = document.querySelector("#unity-warning");

      function resizeCanvases() {
        const w = window.innerWidth;
        const h = window.innerHeight;

        ['unity-canvas', 'video-canvas'].forEach(id => {
          const c = document.getElementById(id);
          if (!c) return;

          c.style.cssText = '';

          c.style.position = 'absolute';
          c.style.top = '0px';
          c.style.left = '0px';
          c.style.width = w + 'px';
          c.style.height = h + 'px';
          c.style.display = 'block';
          c.style.zoom = '1';
          c.style.scale = '1';
          c.style.transform = 'none';
          c.style.margin = '0';
          c.style.padding = '0';
          c.style.border = 'none';

          c.width  = w;
          c.height = h;
        });

        notifyUnityCanvasResize(w, h);
      }

      function notifyUnityCanvasResize(w, h) {
        if (!window.unityInstance) return;

        try {
          window.unityInstance.SendMessage('ARCamera', 'OnCanvasResize', w + ',' + h);
        } catch (e) {
          console.warn('[Canvas] Could not notify Unity:', e);
        }
      }

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #ffdddd; color:#000; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: #fff6cc; color:#000; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function StartAR() {
        var startARDiv = document.querySelector("#startARDiv");
        startARDiv.style.opacity = 0;
        setTimeout(()=>{
          startARDiv.style.display = "none";
        }, 500);

        var buildUrl  = "Build";
        var loaderUrl = buildUrl + "/ZOO.loader.js";

        var config = {
          dataUrl:             buildUrl + "/ZOO.data.unityweb",
          frameworkUrl:        buildUrl + "/ZOO.framework.js.unityweb",
          codeUrl:             buildUrl + "/ZOO.wasm.unityweb",
          streamingAssetsUrl:  "StreamingAssets",
          companyName:         "Storiis",
          productName:         "Storiis",
          productVersion:      "2.0.0",
          showBanner:          unityShowBanner
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          document.getElementsByTagName('head')[0].appendChild(meta);
        }

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = (100 * progress) + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";

            window.unityInstance = unityInstance;
            if (window.permissionsGranted) {
              RequestWebcam();
            }

            var htmlBackBtn = document.getElementById("html-back-button");
            if (htmlBackBtn) {
              htmlBackBtn.style.display = "flex";
            }
          }).catch((message) => {
            alert(message);
          });
        };
        document.body.appendChild(script);
      }

      window.unityFacingMode = "environment";
      window.WEBCAM_SETTINGS = {
        video: {
          facingMode: unityFacingMode,
          width: { ideal: 1280 },
          height: { ideal: 960 },
        },
        audio: false
      };
      window.requestingForPermissions = false;

      async function RequestWebcam() {
        window.requestingForPermissions = true;
        try {
          window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
          requestingForPermissions = false;
          StopWebcam();
        } catch (err) {
          ShowError("Failed to start the experience. Camera permission was denied");
          window.requestingForPermissions = false;
        }
      }

      function StopWebcam() {
        if (!window.webcamStream) return;
        window.webcamStream.getTracks().forEach(track => track.stop());
      }

      async function StartWebcam() {
        window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
        while (window.requestingForPermissions) {
          await new Promise(resolve => setTimeout(resolve, 100));
        }
        if (window.webcamStream) {
          const video = document.querySelector("#webcam-video");
          video.srcObject = webcamStream;
          try {
            await arCamera.startWebcam(video);
            window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamSuccess');

            const uCanvas = document.querySelector("#unity-canvas");
            let bgColor = window.getComputedStyle(uCanvas).backgroundColor;
            uCanvas.style.background =
              bgColor.replace("rgb", "rgba").replace(")", ", 0)");
          } catch (err) {
            window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
          }
        } else {
          window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
        }
      }

      async function LoadWebcams() {
        let camDevices = [];
        let devices = await navigator.mediaDevices.enumerateDevices();

        devices.forEach(mediaDevice => {
          if (mediaDevice.kind === 'videoinput') {
            if (window.unityFacingMode == 'environment' &&
                !mediaDevice.label.includes('facing front')) {
              camDevices.push(mediaDevice);
            } else if (window.unityFacingMode == 'user' &&
                       mediaDevice.label.includes('facing front')) {
              camDevices.push(mediaDevice);
            } else {
              camDevices.push(mediaDevice);
            }
          }
        });

        var select = document.getElementById("chooseCamSel");
        select.style.display = "";
        camDevices = camDevices.reverse();
        let count = 0;
        camDevices.forEach(mediaDevice => {
          const option = document.createElement('option');
          option.value = mediaDevice.deviceId;
          let label = `Camera ${count}`;
          if (mediaDevice.label) {
            label = mediaDevice.label;
          }
          option.appendChild(document.createTextNode(label));
          select.appendChild(option);
          count++;
        });
        iTracker.WEBCAM_NAME = select.options[select.selectedIndex].innerHTML;
      }

      function SelectCam() {
        var select = document.getElementById("chooseCamSel");
        window.deviceId = select.value;
        window.WEBCAM_SETTINGS.video['deviceId'] = deviceId;
        iTracker.WEBCAM_NAME = select.options[select.selectedIndex].innerHTML;
      }

      async function FlipCam() {
        arCamera.stopWebcam();
        window.WEBCAM_SETTINGS.video.deviceId = '';
        if (window.WEBCAM_SETTINGS.video.facingMode == 'user') {
          window.WEBCAM_SETTINGS.video.facingMode = 'environment';
          arCamera.setFlipped(false);
        } else {
          window.WEBCAM_SETTINGS.video.facingMode = 'user';
          arCamera.setFlipped(true);
        }
        window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
        const video = document.querySelector("#webcam-video");
        video.srcObject = webcamStream;
        await arCamera.startWebcam(video);
      }

      async function IsCameraPermissionGranted() {
        if (!navigator.permissions || !navigator.mediaDevices) {
          return false;
        }
        try {
          const permissionStatus = await navigator.permissions.query({ name: "camera" });
          if (permissionStatus.state === "granted") {
            return true;
          } else if (permissionStatus.state === "prompt") {
            return false;
          } else {
            return false;
          }
        } catch (error) {
          return false;
        }
      }

      function ShowError(error) {
        var errorDiv = document.getElementById("errorDiv");
        errorDiv.style.opacity = 1;
        errorDiv.style.display = "";
        document.getElementById("errorText").innerHTML = error;
      }

      function ShowScreenshot(dataUrl) {
        var screenshotDiv = document.getElementById("screenshotDiv");
        screenshotDiv.style.opacity = 1;
        screenshotDiv.style.display = "";
        document.getElementById("screenshotImg").src = dataUrl;
        document.getElementById("screenshotImg").style.width = "80vw";
        document.getElementById("screenshotImg").style.height =
          80 / window.innerWidth * window.innerHeight + "vw";
      }

      function HideScreenshot() {
        var screenshotDiv = document.getElementById('screenshotDiv');
        screenshotDiv.style.opacity = 0;
        setTimeout(()=>{
          screenshotDiv.style.display = 'none';
        }, 500);
      }

      function ShowConfirmUrl(url) {
        var confirmUrlDiv = document.getElementById("confirmUrlDiv");
        confirmUrlDiv.style.opacity = 1;
        confirmUrlDiv.style.display = "";
        window.newUrlString = url;
        document.getElementById("confirmUrlText").innerText =
          "Are you sure you want to visit " + url + "?";
      }

      function HideConfirmUrl() {
        var confirmUrlDiv = document.getElementById("confirmUrlDiv");
        confirmUrlDiv.style.opacity = 0;
        setTimeout(()=>{
          confirmUrlDiv.style.display = 'none';
        }, 500);
      }

      function BackToScanner() {
        try {
          if (window.arCamera && typeof window.arCamera.stopWebcam === "function") {
            window.arCamera.stopWebcam();
          }
        } catch (e) {}

        try {
          if (window.webcamStream) {
            window.webcamStream.getTracks().forEach(track => track.stop());
            window.webcamStream = null;
          }
        } catch (e) {}

        if (window.unityInstance && typeof window.unityInstance.Quit === "function") {
          try {
            window.unityInstance.Quit().then(function () {
              window.unityInstance = null;
              window.location.href = "qr-scanner.html";
            }).catch(function () {
              window.location.href = "qr-scanner.html";
            });
            return;
          } catch (e) {
            window.location.href = "qr-scanner.html";
            return;
          }
        }

        window.location.href = "qr-scanner.html";
      }

      window.ITRACKER_GLOBALS = {
        INTERNAL_SMOOTHFACTOR_POS: .075,
      };

      function isLandscape() {
        return window.innerWidth > window.innerHeight;
      }

      let wasInLandscape = isLandscape();
      let wrongOrientationTimeout = null;

      function showWrongOrientationWithDelay() {
        const wrongOrientationDiv = document.getElementById('wrong-orientation');

        if (wrongOrientationTimeout) {
          clearTimeout(wrongOrientationTimeout);
          wrongOrientationTimeout = null;
        }

        wrongOrientationDiv.style.display = 'flex';

        wrongOrientationTimeout = setTimeout(() => {
          wrongOrientationDiv.style.display = 'none';
          wrongOrientationTimeout = null;
        }, 800);
      }

      function handleOrientationChange() {
        const nowLandscape = isLandscape();

        if (wasInLandscape && !nowLandscape) {
          if (wrongOrientationTimeout) {
            clearTimeout(wrongOrientationTimeout);
            wrongOrientationTimeout = null;
          }

          const el = document.getElementById('wrong-orientation');
          if (el) el.style.display = 'flex';
        } else if (!wasInLandscape && nowLandscape) {
          if (document.getElementById('wrong-orientation')) {
            showWrongOrientationWithDelay();
          }
        }

        wasInLandscape = nowLandscape;
      }

      window.addEventListener('orientationchange', function () {
        setTimeout(handleOrientationChange, 100);
      });

      window.addEventListener('resize', function () {
        clearTimeout(window._orientationResizeTimeout);
        window._orientationResizeTimeout = setTimeout(function () {
          handleOrientationChange();
        }, 200);
      });

      if (screen.orientation) {
        screen.orientation.addEventListener('change', function () {
          setTimeout(function () {
            handleOrientationChange();
          }, 100);
        });
      }

      window.addEventListener('load', function () {
        const wrong = document.getElementById('wrong-orientation');
        if (wrong) wrong.style.display = 'none';

        resizeCanvases();
      });
    </script>

    <script src="autostart.js"></script>
</body>
</html>
