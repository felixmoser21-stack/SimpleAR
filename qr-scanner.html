<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>QR-Code Scanner</title>

  <!-- html5-qrcode Bibliothek -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
    type="text/javascript"
  ></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #header {
      padding: 0.75rem 1rem;
      text-align: center;
      font-size: 1rem;
      border-bottom: 1px solid #333;
      background: #050505;
    }

    #loading-message,
    #error-message {
      text-align: center;
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
    }

    #error-message {
      display: none;
      background: #330000;
      color: #ff8080;
    }

    #content {
      padding: 0.75rem 0.75rem 1rem;
      height: calc(100% - 110px);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    #reader {
      flex: 1;
      min-height: 260px;
      border-radius: 12px;
      overflow: hidden;
      background: #111;
    }

    #result {
      font-size: 0.85rem;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="header">
    Bitte QR-Code scannen
  </div>

  <div id="loading-message">Scanner wird initialisiert…</div>
  <div id="error-message"></div>

  <div id="content">
    <div id="reader"></div>
    <div id="result">Noch kein Code erkannt.</div>
  </div>

  <script>
    // Zielseite (Unity-WebGL-Tracker)
    const TRACKER_PAGE = "index_tracker.html";

    const loadingMessage = document.getElementById("loading-message");
    const errorMessage = document.getElementById("error-message");
    const resultDiv = document.getElementById("result");

    function showError(msg, err) {
      console.error(msg, err || "");
      loadingMessage.style.display = "none";
      errorMessage.style.display = "block";
      errorMessage.textContent =
        msg + (err && err.message ? " – " + err.message : "");
    }

    // --- Helper aus deiner Version ---

    function isValidUrl(string) {
      try {
        const url = new URL(string);
        return url.protocol === "http:" || url.protocol === "https:";
      } catch (_) {
        return false;
      }
    }

    function isValidVideoUrl(string) {
      if (!isValidUrl(string)) return false;
      const videoExtensions = [".mp4", ".webm", ".ogg", ".mov", ".avi", ".mkv"];
      const lowerUrl = string.toLowerCase();
      return videoExtensions.some((ext) => lowerUrl.includes(ext));
    }

    // --- Scan-Callbacks ---

    async function onScanSuccess(decodedText, decodedResult) {
      console.log("=== QR-Code Scan Success ===");
      console.log("Raw QR-Code:", decodedText);
      console.log("Scan Result:", decodedResult);

      loadingMessage.style.display = "none";
      errorMessage.style.display = "none";
      resultDiv.textContent = "Gefundener Code: " + decodedText;

      // Scanner anhalten (Html5QrcodeScanner)
      try {
        await html5QrcodeScanner.clear();
        console.log("Scanner gestoppt (clear) – bereit für Redirect");
      } catch (err) {
        console.error("Fehler beim Stoppen des Scanners:", err);
      }

      // --- Deine URL-/Station-/Video-Logik ---

      let stationId = null;
      let videoUrl = null;

      try {
        if (decodedText.includes("http")) {
          const urlObj = new URL(decodedText);
          stationId = urlObj.searchParams.get("station");
          videoUrl = urlObj.searchParams.get("video");

          if (
            !videoUrl &&
            (decodedText.endsWith(".mp4") ||
              decodedText.endsWith(".mov") ||
              decodedText.endsWith(".webm"))
          ) {
            videoUrl = decodedText;
          }
        } else if (decodedText.includes("=")) {
          const params = new URLSearchParams(decodedText);
          stationId = params.get("station");
          videoUrl = params.get("video");
        } else if (
          decodedText.endsWith(".mp4") ||
          decodedText.endsWith(".mov") ||
          decodedText.endsWith(".webm")
        ) {
          videoUrl = decodedText;
        }
      } catch (err) {
        console.error("QR parsing error:", err);
      }

      console.log("--- Extracted Data ---");
      console.log("Station ID:", stationId || "nicht gefunden");
      console.log("Video URL:", videoUrl || "nicht gefunden");
      console.log("======================");

      // Validation
      if (!stationId && !videoUrl) {
        console.error(
          "Validation failed: No valid data extracted from QR-Code"
        );
        showError(
          "QR-Code enthält keine gültigen Daten (Station oder Video)!"
        );
        setTimeout(() => window.location.reload(), 3000);
        return;
      }

      if (videoUrl && !isValidVideoUrl(videoUrl)) {
        console.error("Validation failed: Invalid video URL:", videoUrl);
        showError(
          "Ungültige Video-URL im QR-Code! Bitte eine gültige HTTP(S)-Video-URL verwenden."
        );
        setTimeout(() => window.location.reload(), 3000);
        return;
      }

      if (stationId) {
        stationId = stationId.trim();
        if (stationId.length === 0) {
          console.warn("Warning: Station ID is empty after trim");
          stationId = null;
        }
      }

      // Ergebnisse in sessionStorage ablegen
      sessionStorage.setItem("qr_raw", decodedText);

      if (stationId) {
        sessionStorage.setItem("stationId", stationId);
        console.log("✓ Stored stationId:", stationId);
      } else {
        sessionStorage.removeItem("stationId");
        console.log("✗ No stationId to store");
      }

      if (videoUrl) {
        sessionStorage.setItem("videoUrl", videoUrl);
        console.log("✓ Stored videoUrl:", videoUrl);
      } else {
        sessionStorage.removeItem("videoUrl");
        console.log("✗ No videoUrl to store");
      }

      // Feedback im UI
      let successMessage = "QR-Code erfolgreich gescannt!";
      if (stationId && videoUrl) {
        successMessage += ` (Station: ${stationId})`;
      } else if (stationId) {
        successMessage += ` (Station: ${stationId})`;
      } else if (videoUrl) {
        successMessage += " (Video gefunden)";
      }
      resultDiv.textContent = successMessage;

      console.log("=== Scan Complete - Redirecting ===");
      console.log("=== BEFORE REDIRECT - Verify Data ===");
      console.log("sessionStorage.videoUrl:", sessionStorage.getItem("videoUrl"));
      console.log(
        "sessionStorage.stationId:",
        sessionStorage.getItem("stationId")
      );
      console.log("sessionStorage.qr_raw:", sessionStorage.getItem("qr_raw"));
      console.log("=====================================");

      // Redirect mit Query-Param-Fallback wie bei dir
      setTimeout(() => {
        const params = new URLSearchParams();
        params.set("qr", "scanned");

        if (videoUrl) {
          params.set("video", encodeURIComponent(videoUrl));
        }
        if (stationId) {
          params.set("station", encodeURIComponent(stationId));
        }

        const redirectUrl = `${TRACKER_PAGE}?${params.toString()}`;
        console.log("Redirecting to:", redirectUrl);

        window.location.href = redirectUrl;
      }, 1000);
    }

    function onScanError(errorMessageText) {
      // Wird sehr häufig aufgerufen – nur im Log, damit die Konsole nicht explodiert
      // console.log("Scan-Fehler / kein Code im Frame:", errorMessageText);
    }

    // Scanner initialisieren (schlanke Variante)
    window.addEventListener("load", () => {
      try {
        if (!window.Html5QrcodeScanner) {
          throw new Error("html5-qrcode Bibliothek nicht geladen.");
        }

        const config = {
          fps: 10,
          qrbox: function (viewfinderWidth, viewfinderHeight) {
            const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
            const boxSize = Math.floor(minEdge * 0.6); // 60 % des kürzeren Randes
            return { width: boxSize, height: boxSize };
          },
        };

        const verbose = false;
        window.html5QrcodeScanner = new Html5QrcodeScanner(
          "reader",
          config,
          verbose
        );

        html5QrcodeScanner.render(onScanSuccess, onScanError);
        loadingMessage.textContent = "Kamera wird gestartet…";
      } catch (err) {
        showError("Fehler bei der Initialisierung des Scanners", err);
      }
    });
  </script>
</body>
</html>
