<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>QR-Code Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        #scanner-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        /* html5-qrcode reader container */
        #qr-reader {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Wichtig: nur Größe + object-fit, keine eigenen transforms! */
        #qr-reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        #qr-reader__scan_region {
            min-height: 100% !important;
            overflow: hidden !important;
        }
        
        #qr-reader__scan_region video {
            object-fit: cover !important;
        }

        #qr-reader__dashboard_section,
        #qr-reader__camera_selection {
            display: none !important;
        }

        #scanner-info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            z-index: 1000;
            max-width: 90%;
        }

        #error-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            z-index: 1000;
            display: none;
            max-width: 90%;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 1001;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom scanning frame overlay */
        #scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        #scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 3px solid #00ff00;
            border-radius: 10px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }

        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid #00ff00;
        }

        .corner.top-left {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
            border-radius: 10px 0 0 0;
        }

        .corner.top-right {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 10px 0 0;
        }

        .corner.bottom-left {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 10px;
        }

        .corner.bottom-right {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 10px 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .scanning .corner {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Kamera wird initialisiert...</div>
    </div>

    <div id="scanner-container" style="display: none;">
        <div id="qr-reader"></div>
        <div id="scanner-overlay">
            <div id="scanner-frame" class="scanning">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
            </div>
        </div>
        <div id="scanner-info">
            Richten Sie den QR-Code auf den Rahmen
        </div>
    </div>

    <div id="error-message"></div>

    <!-- html5-qrcode Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <script>
        let html5QrCode = null;
        let isRestarting = false;
        let orientationChangeTimeout = null;

        function isLandscape() {
            return window.innerWidth > window.innerHeight;
        }

        // Dynamische Konfiguration mit unterschiedlichem aspectRatio & qrbox
        function buildScannerConfig() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const landscape = isLandscape();
            const shortEdge = Math.min(vw, vh);

            let qrbox;
            let aspectRatio;

            if (landscape) {
                // Querformat: eher breiter Scanbereich
                const width = Math.floor(shortEdge * 0.8);
                const height = Math.floor(shortEdge * 0.5);
                qrbox = { width, height };
                aspectRatio = 16 / 9;
            } else {
                // Hochformat: quadratischer Bereich
                const size = Math.floor(shortEdge * 0.8);
                qrbox = { width: size, height: size };
                aspectRatio = 9 / 16;
            }

            return {
                fps: 10,
                qrbox,
                aspectRatio,
                disableFlip: true,
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true
                }
            };
        }

        // Kamera mit Best-Practice-Sequenz wählen:
        // 1) facingMode exact: environment
        // 2) facingMode: environment
        // 3) fallback via getCameras() + deviceId
        async function startWithBestCamera(config) {
            console.log('Trying start with facingMode exact "environment"...');
            try {
                await html5QrCode.start(
                    { facingMode: { exact: "environment" } },
                    config,
                    onScanSuccess,
                    onScanFailure
                );
                console.log('Started with facingMode exact "environment"');
                return;
            } catch (errExact) {
                console.warn('Exact environment failed, fallback to facingMode "environment"', errExact);
            }

            console.log('Trying start with facingMode "environment"...');
            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess,
                    onScanFailure
                );
                console.log('Started with facingMode "environment"');
                return;
            } catch (errEnv) {
                console.warn('facingMode "environment" failed, fallback to deviceId', errEnv);
            }

            console.log('Trying start with deviceId from getCameras()...');
            const devices = await Html5Qrcode.getCameras();
            if (!devices || devices.length === 0) {
                throw new Error('Keine Kamera gefunden.');
            }

            let camera = devices[0];
            const envCam = devices.find(d =>
                d.label.toLowerCase().includes('back') ||
                d.label.toLowerCase().includes('rear') ||
                d.label.toLowerCase().includes('environment')
            );
            if (envCam) camera = envCam;

            console.log('Using camera via deviceId:', camera.label || camera.id);
            await html5QrCode.start(
                { deviceId: { exact: camera.id } },
                config,
                onScanSuccess,
                onScanFailure
            );
        }

        async function restartScanner() {
            if (isRestarting) {
                console.log('Already restarting, skip...');
                return;
            }
            isRestarting = true;
            console.log('Restarting scanner (orientation change)...');

            try {
                if (html5QrCode && html5QrCode.isScanning) {
                    await html5QrCode.stop();
                    console.log('Scanner stopped for restart');
                }
            } catch (e) {
                console.warn('Error stopping scanner during restart:', e);
            }

            try {
                await initScanner();
            } catch (err) {
                console.error('Error re-initializing scanner:', err);
            } finally {
                isRestarting = false;
            }
        }

        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        function isValidVideoUrl(string) {
            if (!isValidUrl(string)) return false;
            const videoExtensions = ['.mp4', '.webm', '.ogg', '.mov', '.avi', '.mkv'];
            const lowerUrl = string.toLowerCase();
            return videoExtensions.some(ext => lowerUrl.includes(ext));
        }

        function onScanSuccess(decodedText, decodedResult) {
            console.log('=== QR-Code Scan Success ===');
            console.log('Raw QR-Code:', decodedText);

            if (html5QrCode) {
                html5QrCode.stop().catch(err => {
                    console.error('Error stopping scanner after success:', err);
                });
            }

            let stationId = null;
            let videoUrl = null;

            try {
                if (decodedText.includes("http")) {
                    const urlObj = new URL(decodedText);
                    stationId = urlObj.searchParams.get("station");
                    videoUrl = urlObj.searchParams.get("video");

                    if (!videoUrl && (decodedText.endsWith(".mp4") || decodedText.endsWith(".mov") || decodedText.endsWith(".webm"))) {
                        videoUrl = decodedText;
                    }
                } else if (decodedText.includes("=")) {
                    const params = new URLSearchParams(decodedText);
                    stationId = params.get("station");
                    videoUrl = params.get("video");
                } else if (decodedText.endsWith(".mp4") || decodedText.endsWith(".mov") || decodedText.endsWith(".webm")) {
                    videoUrl = decodedText;
                }
            } catch (err) {
                console.error("QR parsing error:", err);
            }

            console.log('--- Extracted Data ---');
            console.log('Station ID:', stationId || 'nicht gefunden');
            console.log('Video URL:', videoUrl || 'nicht gefunden');

            if (!stationId && !videoUrl) {
                showError('QR-Code enthält keine gültigen Daten (Station oder Video)!');
                setTimeout(() => window.location.reload(), 3000);
                return;
            }

            if (videoUrl && !isValidVideoUrl(videoUrl)) {
                showError('Ungültige Video-URL im QR-Code! Bitte verwenden Sie eine gültige HTTP(S) Video-URL.');
                setTimeout(() => window.location.reload(), 3000);
                return;
            }

            if (stationId) {
                stationId = stationId.trim();
                if (!stationId) stationId = null;
            }

            sessionStorage.setItem("qr_raw", decodedText);

            if (stationId) {
                sessionStorage.setItem("stationId", stationId);
            } else {
                sessionStorage.removeItem("stationId");
            }

            if (videoUrl) {
                sessionStorage.setItem("videoUrl", videoUrl);
            } else {
                sessionStorage.removeItem("videoUrl");
            }

            const infoDiv = document.getElementById('scanner-info');
            let successMessage = 'QR-Code erfolgreich gescannt!';
            if (stationId && videoUrl) {
                successMessage += ` (Station: ${stationId})`;
            } else if (stationId) {
                successMessage += ` (Station: ${stationId})`;
            } else if (videoUrl) {
                successMessage += ' (Video gefunden)';
            }

            infoDiv.textContent = successMessage;
            infoDiv.style.background = 'rgba(0, 255, 0, 0.8)';
            document.getElementById('scanner-frame').classList.remove('scanning');

            setTimeout(() => {
                const params = new URLSearchParams();
                params.set('qr', 'scanned');
                if (videoUrl) params.set('video', encodeURIComponent(videoUrl));
                if (stationId) params.set('station', encodeURIComponent(stationId));
                const redirectUrl = 'index_tracker.html?' + params.toString();
                window.location.href = redirectUrl;
            }, 1000);
        }

        function onScanFailure(error) {
            // Wird sehr häufig aufgerufen – bewusst stumm
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }

        async function initScanner() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('scanner-container');

            try {
                console.log('Initializing scanner...');
                loading.style.display = 'block';
                container.style.display = 'flex';

                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("qr-reader");
                } else {
                    try {
                        if (html5QrCode.isScanning) {
                            await html5QrCode.stop();
                        }
                    } catch (e) {
                        console.warn('Error stopping previous scan in init:', e);
                    }
                }

                const config = buildScannerConfig();
                console.log('Scanner config:', config);

                // Kamera mit Back-Kamera-Best-Practice starten
                await startWithBestCamera(config);

                console.log('Scanner started');
                loading.style.display = 'none';

            } catch (error) {
                console.error('Scanner initialization error:', error);
                loading.style.display = 'none';

                let errorMessage = 'Kamera-Zugriff fehlgeschlagen.';
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    errorMessage = 'Kamera-Zugriff verweigert. Bitte erlauben Sie den Kamera-Zugriff in Ihren Browser-Einstellungen.';
                } else if (error.name === 'NotFoundError') {
                    errorMessage = 'Keine Kamera gefunden. Bitte stellen Sie sicher, dass Ihr Gerät eine Kamera hat.';
                } else if (error.name === 'NotReadableError') {
                    errorMessage = 'Kamera wird bereits von einer anderen Anwendung verwendet.';
                } else if (error.name === 'OverconstrainedError') {
                    errorMessage = 'Kamera-Einstellungen werden nicht unterstützt.';
                } else if (error.name === 'SecurityError') {
                    errorMessage = 'Kamera-Zugriff nur über HTTPS möglich (außer localhost).';
                }

                showError(errorMessage);
            }
        }

        async function stopScanner() {
            if (html5QrCode) {
                try {
                    if (html5QrCode.isScanning) {
                        await html5QrCode.stop();
                        console.log('Scanner stopped');
                    }
                } catch (e) {
                    console.warn('Error stopping scanner:', e);
                }
            }
        }

        // Stop-&-Restart bei Orientation-Change mit Debounce + neuem aspectRatio/qrbox
        function handleOrientationChange() {
            console.log('Orientation/resize event detected');

            if (orientationChangeTimeout) {
                clearTimeout(orientationChangeTimeout);
            }

            orientationChangeTimeout = setTimeout(() => {
                console.log('Orientation stabilized, restarting scanner...');
                restartScanner();
            }, 500); // kleiner Puffer, damit das Layout sich setzen kann
        }

        window.addEventListener('load', () => {
            console.log('Page loaded, starting scanner...');
            initScanner();
        });

        window.addEventListener('beforeunload', () => {
            stopScanner();
        });

        document.addEventListener('visibilitychange', () => {
            if (!html5QrCode) return;

            if (document.hidden) {
                if (html5QrCode.isScanning) {
                    html5QrCode.pause();
                }
            } else {
                if (html5QrCode.isScanning) {
                    html5QrCode.resume();
                }
            }
        });

        window.addEventListener('orientationchange', handleOrientationChange);
        window.addEventListener('resize', handleOrientationChange);
        if (screen.orientation) {
            screen.orientation.addEventListener('change', handleOrientationChange);
        }
    </script>
</body>
</html>
