<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
    let html5QrCode = null;
    let isRestarting = false;
    let orientationChangeTimeout = null;

    function isLandscape() {
        return window.innerWidth > window.innerHeight;
    }

    // Dynamischer qrbox-Size, abhängig von der Viewport-Größe
    function getQrBox(viewportWidth, viewportHeight) {
        const minEdge = Math.min(viewportWidth, viewportHeight);
        const boxSize = Math.floor(minEdge * 0.6); // 60% der kurzen Kante
        return { width: boxSize, height: boxSize };
    }

    // Scanner sauber neu starten
    async function restartScanner() {
        if (isRestarting) {
            console.log('Already restarting, skipping...');
            return;
        }

        isRestarting = true;
        console.log('Restarting scanner...');

        try {
            if (html5QrCode && html5QrCode.isScanning) {
                await html5QrCode.stop();
                console.log('Scanner stopped for restart');
            }
        } catch (e) {
            console.warn('Error stopping scanner during restart:', e);
        }

        try {
            await initScanner();
        } catch (err) {
            console.error('Error re-initializing scanner:', err);
        } finally {
            isRestarting = false;
        }
    }

    function isValidUrl(string) {
        try {
            const url = new URL(string);
            return url.protocol === 'http:' || url.protocol === 'https:';
        } catch (_) {
            return false;
        }
    }

    function isValidVideoUrl(string) {
        if (!isValidUrl(string)) return false;
        const videoExtensions = ['.mp4', '.webm', '.ogg', '.mov', '.avi', '.mkv'];
        const lowerUrl = string.toLowerCase();
        return videoExtensions.some(ext => lowerUrl.includes(ext));
    }

    function onScanSuccess(decodedText, decodedResult) {
        console.log('=== QR-Code Scan Success ===');
        console.log('Raw QR-Code:', decodedText);

        if (html5QrCode) {
            html5QrCode.stop().catch(err => {
                console.error('Error stopping scanner after success:', err);
            });
        }

        let stationId = null;
        let videoUrl = null;

        try {
            if (decodedText.includes("http")) {
                const urlObj = new URL(decodedText);
                stationId = urlObj.searchParams.get("station");
                videoUrl = urlObj.searchParams.get("video");

                if (!videoUrl && (decodedText.endsWith(".mp4") || decodedText.endsWith(".mov") || decodedText.endsWith(".webm"))) {
                    videoUrl = decodedText;
                }
            } else if (decodedText.includes("=")) {
                const params = new URLSearchParams(decodedText);
                stationId = params.get("station");
                videoUrl = params.get("video");
            } else if (decodedText.endsWith(".mp4") || decodedText.endsWith(".mov") || decodedText.endsWith(".webm")) {
                videoUrl = decodedText;
            }
        } catch (err) {
            console.error("QR parsing error:", err);
        }

        console.log('--- Extracted Data ---');
        console.log('Station ID:', stationId || 'nicht gefunden');
        console.log('Video URL:', videoUrl || 'nicht gefunden');

        if (!stationId && !videoUrl) {
            showError('QR-Code enthält keine gültigen Daten (Station oder Video)!');
            setTimeout(() => window.location.reload(), 3000);
            return;
        }

        if (videoUrl && !isValidVideoUrl(videoUrl)) {
            showError('Ungültige Video-URL im QR-Code! Bitte verwenden Sie eine gültige HTTP(S) Video-URL.');
            setTimeout(() => window.location.reload(), 3000);
            return;
        }

        if (stationId) {
            stationId = stationId.trim();
            if (!stationId) stationId = null;
        }

        sessionStorage.setItem("qr_raw", decodedText);

        if (stationId) {
            sessionStorage.setItem("stationId", stationId);
        } else {
            sessionStorage.removeItem("stationId");
        }

        if (videoUrl) {
            sessionStorage.setItem("videoUrl", videoUrl);
        } else {
            sessionStorage.removeItem("videoUrl");
        }

        const infoDiv = document.getElementById('scanner-info');
        let successMessage = 'QR-Code erfolgreich gescannt!';
        if (stationId && videoUrl) {
            successMessage += ` (Station: ${stationId})`;
        } else if (stationId) {
            successMessage += ` (Station: ${stationId})`;
        } else if (videoUrl) {
            successMessage += ' (Video gefunden)';
        }

        infoDiv.textContent = successMessage;
        infoDiv.style.background = 'rgba(0, 255, 0, 0.8)';
        document.getElementById('scanner-frame').classList.remove('scanning');

        setTimeout(() => {
            const params = new URLSearchParams();
            params.set('qr', 'scanned');
            if (videoUrl) params.set('video', encodeURIComponent(videoUrl));
            if (stationId) params.set('station', encodeURIComponent(stationId));
            const redirectUrl = 'index_tracker.html?' + params.toString();
            window.location.href = redirectUrl;
        }, 1000);
    }

    function onScanFailure(error) {
        // bewusst leer – wird permanent aufgerufen
    }

    function showError(message) {
        const errorDiv = document.getElementById('error-message');
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        document.getElementById('loading').style.display = 'none';
    }

    async function initScanner() {
        const loading = document.getElementById('loading');
        const container = document.getElementById('scanner-container');

        try {
            console.log('Initializing scanner...');
            loading.style.display = 'block';
            container.style.display = 'flex';

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("qr-reader");
            } else {
                // sicherheitshalber stoppen
                try {
                    if (html5QrCode.isScanning) {
                        await html5QrCode.stop();
                    }
                } catch (e) {
                    console.warn('Error stopping previous scan in init:', e);
                }
            }

            const devices = await Html5Qrcode.getCameras();
            if (!devices || devices.length === 0) {
                showError('Keine Kamera gefunden. Bitte stellen Sie sicher, dass Ihr Gerät eine Kamera hat.');
                return;
            }

            console.log('Available cameras:', devices);

            let cameraId = devices[0].id;
            const backCamera = devices.find(d =>
                d.label.toLowerCase().includes('back') ||
                d.label.toLowerCase().includes('rear') ||
                d.label.toLowerCase().includes('environment')
            );
            if (backCamera) {
                cameraId = backCamera.id;
                console.log('Using back camera:', backCamera.label);
            } else {
                console.log('Using default camera:', devices[0].label);
            }

            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            const config = {
                fps: 10,
                qrbox: getQrBox(viewportWidth, viewportHeight),
                disableFlip: true, // für Back-Cam fast immer sinnvoll
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true
                }
                // KEINE eigenen videoConstraints & aspectRatio, Browser kümmert sich
            };

            console.log('Starting scanner with config:', config);

            await html5QrCode.start(
                { deviceId: { exact: cameraId } },
                config,
                onScanSuccess,
                onScanFailure
            );

            console.log('Scanner started');
            loading.style.display = 'none';

        } catch (error) {
            console.error('Scanner initialization error:', error);

            let errorMessage = 'Kamera-Zugriff fehlgeschlagen.';
            if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                errorMessage = 'Kamera-Zugriff verweigert. Bitte erlauben Sie den Kamera-Zugriff in Ihren Browser-Einstellungen.';
            } else if (error.name === 'NotFoundError') {
                errorMessage = 'Keine Kamera gefunden. Bitte stellen Sie sicher, dass Ihr Gerät eine Kamera hat.';
            } else if (error.name === 'NotReadableError') {
                errorMessage = 'Kamera wird bereits von einer anderen Anwendung verwendet.';
            } else if (error.name === 'OverconstrainedError') {
                errorMessage = 'Kamera-Einstellungen werden nicht unterstützt.';
            } else if (error.name === 'SecurityError') {
                errorMessage = 'Kamera-Zugriff nur über HTTPS möglich (außer localhost).';
            }

            showError(errorMessage);
        }
    }

    async function stopScanner() {
        if (html5QrCode) {
            try {
                if (html5QrCode.isScanning) {
                    await html5QrCode.stop();
                    console.log('Scanner stopped');
                }
            } catch (e) {
                console.warn('Error stopping scanner:', e);
            }
        }
    }

    // Variante A: in beiden Orientierungen aktiv, bei Wechsel neu starten
    function handleOrientationChange() {
        console.log('Orientation/resize event detected');

        if (orientationChangeTimeout) {
            clearTimeout(orientationChangeTimeout);
        }

        orientationChangeTimeout = setTimeout(() => {
            console.log('Orientation stabilized, restarting scanner...');
            restartScanner();
        }, 500);
    }

    window.addEventListener('load', () => {
        console.log('Page loaded, starting scanner...');
        initScanner();
    });

    window.addEventListener('beforeunload', () => {
        stopScanner();
    });

    document.addEventListener('visibilitychange', () => {
        if (!html5QrCode) return;

        if (document.hidden) {
            if (html5QrCode.isScanning) {
                html5QrCode.pause();
            }
        } else {
            if (html5QrCode.isScanning) {
                html5QrCode.resume();
            }
        }
    });

    window.addEventListener('orientationchange', handleOrientationChange);
    window.addEventListener('resize', handleOrientationChange);
    if (screen.orientation) {
        screen.orientation.addEventListener('change', handleOrientationChange);
    }
</script>
