<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>QR-Code Scanner Debug</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        #scanner-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #qr-video-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #qr-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #scanner-info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            z-index: 1000;
            max-width: 90%;
        }

        #error-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            z-index: 1001;
            display: none;
            max-width: 90%;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 1002;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Overlay */
        #scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        #scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 3px solid #00ff00;
            border-radius: 10px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }

        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid #00ff00;
        }

        .corner.top-left {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
            border-radius: 10px 0 0 0;
        }

        .corner.top-right {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 10px 0 0;
        }

        .corner.bottom-left {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 10px;
        }

        .corner.bottom-right {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 10px 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .scanning .corner {
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Sichtbare Debug-Konsole Unten */
        #debug-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            max-height: 40vh;
            background: rgba(0, 0, 0, 0.9);
            color: #ffea00;
            z-index: 99999;
            font-family: monospace;
            font-size: 11px;
            padding: 6px 8px;
            overflow-y: auto;
            border-top: 2px solid #ffea00;
        }

        #debug-title {
            font-weight: bold;
            margin-bottom: 4px;
            color: #fff200;
        }

        #debug-content {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Kamera wird initialisiert...</div>
    </div>

    <div id="scanner-container" style="display: none;">
        <div id="qr-video-wrapper">
            <video id="qr-video" muted playsinline></video>
        </div>

        <div id="scanner-overlay">
            <div id="scanner-frame" class="scanning">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
            </div>
        </div>

        <div id="scanner-info">
            Richten Sie den QR-Code auf den Rahmen
        </div>
    </div>

    <div id="error-message"></div>

    <!-- Sichtbare Debug-Konsole -->
    <div id="debug-overlay">
        <div id="debug-title">DEBUG KONSOLE</div>
        <div id="debug-content"></div>
    </div>

    <!-- qr-scanner Library -->
    <script src="https://unpkg.com/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
    <script>
        // Worker-Pfad für qr-scanner
        QrScanner.WORKER_PATH = 'https://unpkg.com/qr-scanner@1.4.2/qr-scanner-worker.min.js';

        let qrScanner = null;
        let orientationChangeTimeout = null;
        let isRestarting = false;
        let hasScanned = false; // verhindert mehrfaches Auslösen

        // Sichtbares Debug-Logging (auch auf iOS)
        function debugLog() {
            const msg = [...arguments].map(a =>
                typeof a === "object" ? JSON.stringify(a, null, 2) : String(a)
            ).join(" ");

            const dbg = document.getElementById("debug-content");
            if (dbg) {
                dbg.textContent += msg + "\n";
                dbg.parentElement.scrollTop = dbg.parentElement.scrollHeight;
            }

            try {
                console.log("[DEBUG]", msg);
            } catch (e) {}
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            errorDiv.style.background = 'rgba(255,0,0,0.95)';
            document.getElementById('loading').style.display = 'none';
            debugLog("ERROR:", message);
        }

        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        // Entspannter Video-URL-Check: nur "ist es eine HTTP/HTTPS-URL?"
        function isValidVideoUrl(string) {
            return isValidUrl(string);
        }

        // === Scan-Erfolgslogik: Scanner stoppt, keine Redirect-Ausführung ===
        async function handleDecoded(decodedText) {
            debugLog("SCAN TRIGGERED");

            // Scanner sofort stoppen – keine weiteren Scans
            try {
                if (qrScanner) {
                    await qrScanner.stop();
                    debugLog("Scanner STOPPED after first decode.");
                }
            } catch (e) {
                debugLog("Error stopping scanner:", e);
            }

            hasScanned = true;

            debugLog('=== QR-Code Scan Success ===');
            debugLog('RAW QR TEXT:', decodedText);

            let stationId = null;
            let videoUrl = null;

            try {
                if (decodedText.includes("http")) {
                    const urlObj = new URL(decodedText);
                    stationId = urlObj.searchParams.get("station");
                    videoUrl = urlObj.searchParams.get("video");

                    debugLog("URL parsed:", {
                        href: urlObj.href,
                        stationId,
                        videoUrl
                    });

                    if (!videoUrl && (
                        decodedText.endsWith(".mp4") ||
                        decodedText.endsWith(".mov") ||
                        decodedText.endsWith(".webm")
                    )) {
                        videoUrl = decodedText;
                        debugLog("Fallback videoUrl from file extension:", videoUrl);
                    }

                } else if (decodedText.includes("=")) {
                    const params = new URLSearchParams(decodedText);
                    stationId = params.get("station");
                    videoUrl = params.get("video");

                    debugLog("Query-only parsed:", { stationId, videoUrl });
                } else if (
                    decodedText.endsWith(".mp4") ||
                    decodedText.endsWith(".mov") ||
                    decodedText.endsWith(".webm")
                ) {
                    videoUrl = decodedText;
                    debugLog("Bare video path parsed as videoUrl:", videoUrl);
                }
            } catch (err) {
                debugLog("PARSE ERROR:", err.message || String(err));
            }

            debugLog("Parsed stationId:", stationId);
            debugLog("Parsed videoUrl:", videoUrl);

            if (stationId) {
                stationId = stationId.trim();
                if (!stationId) stationId = null;
            }
            debugLog("Trimmed stationId:", stationId);

            if (!stationId && !videoUrl) {
                debugLog("NO VALID PARSE RESULT — STOPPING HERE.");
                showError("QR-Code konnte nicht verstanden werden.");
                return;
            }

            if (videoUrl) {
                const ok = isValidVideoUrl(videoUrl);
                debugLog("Video URL valid?", ok, ":", videoUrl);
                if (!ok) {
                    showError("Ungültige Video-URL im QR-Code: " + videoUrl);
                    return;
                }
            } else {
                debugLog("No videoUrl, only stationId present (might be valid in deinem Flow).");
            }

            // sessionStorage schreiben
            sessionStorage.setItem("qr_raw", decodedText);
            if (stationId) sessionStorage.setItem("stationId", stationId); else sessionStorage.removeItem("stationId");
            if (videoUrl) sessionStorage.setItem("videoUrl", videoUrl);   else sessionStorage.removeItem("videoUrl");

            debugLog("Stored sessionStorage.qr_raw =", sessionStorage.getItem("qr_raw"));
            debugLog("Stored sessionStorage.stationId =", sessionStorage.getItem("stationId"));
            debugLog("Stored sessionStorage.videoUrl =", sessionStorage.getItem("videoUrl"));

            const infoDiv = document.getElementById("scanner-info");
            let successMessage = "Scan abgeschlossen (Debug-Modus) – Redirect wird NICHT ausgeführt.";
            infoDiv.textContent = successMessage;
            infoDiv.style.background = "rgba(0, 150, 0, 0.8)";
            document.getElementById("scanner-frame").classList.remove("scanning");
            debugLog("UI message:", successMessage);

            // Redirect-URL nur berechnen und anzeigen – NICHT ausführen
            const params = new URLSearchParams();
            params.set("qr", "scanned");
            if (videoUrl) params.set("video", videoUrl);
            if (stationId) params.set("station", stationId);

            const redirectUrl = "index_tracker.html?" + params.toString();
            debugLog("FINAL REDIRECT URL (NOT EXECUTED):", redirectUrl);

            debugLog("DEBUG-MODUS: Bitte URL prüfen und ggf. manuell im Browser aufrufen.");
        }

        async function initScanner() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('scanner-container');
            const videoElem = document.getElementById('qr-video');

            try {
                debugLog('Initializing qr-scanner...');
                loading.style.display = 'block';
                container.style.display = 'flex';

                hasScanned = false; // bei jedem Init zurücksetzen

                if (!qrScanner) {
                    qrScanner = new QrScanner(
                        videoElem,
                        result => {
                            debugLog('Decoded result from qr-scanner callback:', result);
                            handleDecoded(result);
                        },
                        {
                            preferredCamera: 'environment',
                            highlightScanRegion: false,
                            highlightCodeOutline: false
                        }
                    );
                }

                await qrScanner.start();
                debugLog('qr-scanner started successfully.');
                loading.style.display = 'none';
            } catch (err) {
                debugLog('qr-scanner init error:', err.message || String(err));
                loading.style.display = 'none';
                showError('Kamera-Zugriff fehlgeschlagen. Bitte HTTPS & Kameraberechtigung prüfen.');
            }
        }

        async function restartScanner() {
            if (isRestarting) {
                debugLog('Already restarting, skip...');
                return;
            }
            isRestarting = true;
            debugLog('Restarting qr-scanner (orientation change)...');

            try {
                if (qrScanner) {
                    await qrScanner.stop();
                    debugLog('qr-scanner stopped for restart.');
                }
            } catch (e) {
                debugLog('Error stopping on restart:', e.message || String(e));
            }

            try {
                await initScanner();
            } finally {
                isRestarting = false;
            }
        }

        function handleOrientationChange() {
            // Nach einem erfolgreichen Scan NICHT neu starten (kein Loop)
            if (hasScanned) {
                debugLog('Orientation change ignored (hasScanned = true).');
                return;
            }

            debugLog('Orientation/resize event detected (qr-scanner)');

            if (orientationChangeTimeout) {
                clearTimeout(orientationChangeTimeout);
            }

            orientationChangeTimeout = setTimeout(() => {
                debugLog('Orientation stabilized, restarting qr-scanner...');
                restartScanner();
            }, 500);
        }

        window.addEventListener('load', () => {
            debugLog('Page loaded, starting qr-scanner...');
            initScanner();
        });

        window.addEventListener('beforeunload', () => {
            if (qrScanner) {
                qrScanner.stop();
                debugLog('qr-scanner stopped on beforeunload.');
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (!qrScanner) return;
            if (document.hidden) {
                qrScanner.pause();
                debugLog('Document hidden: qr-scanner paused.');
            } else {
                // nach einem Debug-Scan nicht wieder aufnehmen
                if (!hasScanned) {
                    qrScanner.resume();
                    debugLog('Document visible: qr-scanner resumed.');
                } else {
                    debugLog('Document visible: resume ignored (hasScanned = true).');
                }
            }
        });

        window.addEventListener('orientationchange', handleOrientationChange);
        window.addEventListener('resize', handleOrientationChange);
        if (screen.orientation) {
            screen.orientation.addEventListener('change', handleOrientationChange);
        }
    </script>
</body>
</html>
