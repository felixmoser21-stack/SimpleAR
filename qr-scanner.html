<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>QR-Code Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        #scanner-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #qr-video-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #qr-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #scanner-info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            z-index: 1000;
            max-width: 90%;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 1002;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Overlay */
        #scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        #scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 3px solid #007bff; /* Standard: blau */
            border-radius: 10px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }

        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid #007bff; /* wird per Klasse überschrieben */
        }

        .corner.top-left {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
            border-radius: 10px 0 0 0;
        }

        .corner.top-right {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 10px 0 0;
        }

        .corner.bottom-left {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 10px;
        }

        .corner.bottom-right {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 10px 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .scanning .corner {
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Farbzustände des Rahmens */
        .frame-blue,
        .frame-blue .corner {
            border-color: #007bff;
        }

        .frame-green,
        .frame-green .corner {
            border-color: #00c853;
        }

        .frame-red,
        .frame-red .corner {
            border-color: #ff1744;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <!-- Kein Text mehr hier -->
    </div>

    <div id="scanner-container" style="display: none;">
        <div id="qr-video-wrapper">
            <video id="qr-video" muted playsinline></video>
        </div>

        <div id="scanner-overlay">
            <div id="scanner-frame" class="frame-blue scanning">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
            </div>
        </div>

        <div id="scanner-info">
            QR-Code scannen
        </div>
    </div>

    <!-- qr-scanner Library -->
    <script src="https://unpkg.com/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
    <script>
        let qrScanner = null;
        let orientationChangeTimeout = null;
        let isRestarting = false;
        let hasScanned = false;

        function setFrameState(state) {
            const frame = document.getElementById('scanner-frame');
            frame.classList.remove('frame-blue', 'frame-green', 'frame-red', 'scanning');
            if (state === 'blue') {
                frame.classList.add('frame-blue', 'scanning');
            } else if (state === 'green') {
                frame.classList.add('frame-green');
            } else if (state === 'red') {
                frame.classList.add('frame-red');
            }
        }

        function showError() {
            // Nur Rahmen rot, keine weiteren Texte
            setFrameState('red');
        }

        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        function isValidVideoUrl(string) {
            return isValidUrl(string);
        }

        async function handleDecoded(decodedText) {
            if (hasScanned) return;
            hasScanned = true;

            let stationId = null;
            let videoUrl = null;

            try {
                if (decodedText.includes("http")) {
                    const urlObj = new URL(decodedText);
                    stationId = urlObj.searchParams.get("station");
                    videoUrl = urlObj.searchParams.get("video");

                    const lower = decodedText.toLowerCase();
                    const hasVideoExt =
                        lower.endsWith(".mp4") ||
                        lower.endsWith(".mov") ||
                        lower.endsWith(".webm") ||
                        lower.endsWith(".mkv") ||
                        lower.endsWith(".ogg");

                    if (!videoUrl && hasVideoExt) {
                        videoUrl = decodedText;
                    }

                    if (!videoUrl && !stationId && isValidUrl(decodedText)) {
                        videoUrl = decodedText;
                    }

                } else if (decodedText.includes("=")) {
                    const params = new URLSearchParams(decodedText);
                    stationId = params.get("station");
                    videoUrl = params.get("video");
                } else {
                    const lower = decodedText.toLowerCase();
                    if (
                        lower.endsWith(".mp4") ||
                        lower.endsWith(".mov") ||
                        lower.endsWith(".webm") ||
                        lower.endsWith(".mkv") ||
                        lower.endsWith(".ogg")
                    ) {
                        videoUrl = decodedText;
                    }
                }
            } catch (err) {
                showError();
                return;
            }

            if (stationId) {
                stationId = stationId.trim();
                if (!stationId) stationId = null;
            }

            if (!stationId && !videoUrl) {
                showError();
                return;
            }

            if (videoUrl && !isValidVideoUrl(videoUrl)) {
                showError();
                return;
            }

            // Daten speichern
            sessionStorage.setItem("qr_raw", decodedText);
            if (stationId) sessionStorage.setItem("stationId", stationId); else sessionStorage.removeItem("stationId");
            if (videoUrl)  sessionStorage.setItem("videoUrl",  videoUrl);  else sessionStorage.removeItem("videoUrl");

            // Rahmen grün
            setFrameState('green');

            // Redirect
            const params = new URLSearchParams();
            params.set("qr", "scanned");
            if (videoUrl)  params.set("video",  videoUrl);
            if (stationId) params.set("station", stationId);

            const redirectUrl = "index_tracker.html?" + params.toString();

            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 800);
        }

        async function initScanner() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('scanner-container');
            const videoElem = document.getElementById('qr-video');

            try {
                loading.style.display = 'block';
                container.style.display = 'flex';

                hasScanned = false;
                setFrameState('blue');

                if (!qrScanner) {
                    qrScanner = new QrScanner(
                        videoElem,
                        scanResult => {
                            const decodedText = (typeof scanResult === "string")
                                ? scanResult
                                : scanResult.data;
                            handleDecoded(decodedText);
                        },
                        {
                            preferredCamera: 'environment',
                            highlightScanRegion: false,
                            highlightCodeOutline: false,
                            returnDetailedScanResult: true
                        }
                    );
                }

                await qrScanner.start();
                loading.style.display = 'none';
            } catch (err) {
                loading.style.display = 'none';
                showError();
            }
        }

        async function restartScanner() {
            if (isRestarting || hasScanned) return;
            isRestarting = true;

            try {
                if (qrScanner) {
                    await qrScanner.stop();
                }
            } catch (e) {
                // ignore
            }

            try {
                await initScanner();
            } finally {
                isRestarting = false;
            }
        }

        function handleOrientationChange() {
            if (hasScanned) return;

            if (orientationChangeTimeout) {
                clearTimeout(orientationChangeTimeout);
            }

            orientationChangeTimeout = setTimeout(() => {
                restartScanner();
            }, 500);
        }

        window.addEventListener('load', () => {
            initScanner();
        });

        window.addEventListener('beforeunload', () => {
            if (qrScanner) {
                qrScanner.stop();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (!qrScanner) return;
            if (document.hidden) {
                qrScanner.pause();
            } else {
                if (!hasScanned) {
                    qrScanner.resume();
                }
            }
        });

        window.addEventListener('orientationchange', handleOrientationChange);
        window.addEventListener('resize', handleOrientationChange);
        if (screen.orientation && screen.orientation.addEventListener) {
            screen.orientation.addEventListener('change', handleOrientationChange);
        }
    </script>
</body>
</html>
