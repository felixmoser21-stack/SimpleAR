<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
  />
  <title>Scan QR-Code</title>

  <!-- html5-qrcode Library -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
    type="text/javascript"
  ></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    #header {
      flex: 0 0 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #222;
      background: #050505;
      font-size: 1.1rem;
      font-weight: 500;
    }

    #scanner-wrapper {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    #qr-reader {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Video fullscreen in Portrait & Landscape */
    #qr-reader video {
      position: absolute;
      width: 100% !important;
      height: 100% !important;
      top: 0;
      left: 0;
      object-fit: cover !important;
      transform: none !important;
      -webkit-transform: none !important;
    }

    /* Scan-Rahmen */
    #scan-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(60vw, 60vh);
      height: min(60vw, 60vh);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
      border: 2px solid #00ff88;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 3px solid #00ff88;
    }

    .corner.tl {
      top: -3px;
      left: -3px;
      border-right: none;
      border-bottom: none;
      border-radius: 10px 0 0 0;
    }

    .corner.tr {
      top: -3px;
      right: -3px;
      border-left: none;
      border-bottom: none;
      border-radius: 0 10px 0 0;
    }

    .corner.bl {
      bottom: -3px;
      left: -3px;
      border-right: none;
      border-top: none;
      border-radius: 0 0 0 10px;
    }

    .corner.br {
      bottom: -3px;
      right: -3px;
      border-left: none;
      border-top: none;
      border-radius: 0 0 10px 0;
    }

    .scanning .corner {
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Nur Fehler-Badge, kein Status-Text */
    #error-message {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 14px;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      white-space: nowrap;
      max-width: 90%;
      text-overflow: ellipsis;
      overflow: hidden;
      background: rgba(150, 0, 0, 0.9);
      color: #ffdddd;
      display: none;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.8rem;
      background: #000;
      z-index: 5;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">Scan QR-Code</div>

    <div id="scanner-wrapper">
      <div id="qr-reader"></div>

      <div id="scan-frame" class="scanning">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
      </div>

      <div id="loading">
        <div class="spinner"></div>
        <div style="font-size:0.9rem;">Kamera wird initialisiert…</div>
      </div>

      <div id="error-message"></div>
    </div>
  </div>

  <script>
    const TRACKER_PAGE = "index_tracker.html";

    let html5QrCode = null;
    let hasStarted = false;
    let currentOrientation = null;
    let restartTimeout = null;

    const loadingOverlay = document.getElementById("loading");
    const errorDiv = document.getElementById("error-message");
    const frame = document.getElementById("scan-frame");

    function isLandscape() {
      return window.innerWidth > window.innerHeight;
    }

    function showError(msg, err) {
      console.error(msg, err || "");
      loadingOverlay.style.display = "none";
      errorDiv.style.display = "block";
      errorDiv.textContent = msg;
    }

    function isValidUrl(string) {
      try {
        const url = new URL(string);
        return url.protocol === "http:" || url.protocol === "https:";
      } catch (_) {
        return false;
      }
    }

    function isValidVideoUrl(string) {
      if (!isValidUrl(string)) return false;
      const videoExtensions = [".mp4", ".webm", ".ogg", ".mov", ".avi", ".mkv"];
      const lowerUrl = string.toLowerCase();
      return videoExtensions.some((ext) => lowerUrl.includes(ext));
    }

    async function stopScanner() {
      if (html5QrCode && hasStarted) {
        try {
          await html5QrCode.stop();
        } catch (e) {
          console.warn("Fehler beim Stoppen des Scanners:", e);
        }
        hasStarted = false;
      }
    }

    async function onScanSuccess(decodedText, decodedResult) {
      console.log("=== QR-Code Scan Success ===");
      console.log("Raw QR-Code:", decodedText);
      console.log("Scan Result:", decodedResult);

      frame.classList.remove("scanning");
      await stopScanner();

      let stationId = null;
      let videoUrl = null;

      try {
        if (decodedText.includes("http")) {
          const urlObj = new URL(decodedText);
          stationId = urlObj.searchParams.get("station");
          videoUrl = urlObj.searchParams.get("video");

          if (
            !videoUrl &&
            (decodedText.endsWith(".mp4") ||
              decodedText.endsWith(".mov") ||
              decodedText.endsWith(".webm"))
          ) {
            videoUrl = decodedText;
          }
        } else if (decodedText.includes("=")) {
          const params = new URLSearchParams(decodedText);
          stationId = params.get("station");
          videoUrl = params.get("video");
        } else if (
          decodedText.endsWith(".mp4") ||
          decodedText.endsWith(".mov") ||
          decodedText.endsWith(".webm")
        ) {
          videoUrl = decodedText;
        }
      } catch (err) {
        console.error("QR parsing error:", err);
      }

      console.log("--- Extracted Data ---");
      console.log("Station ID:", stationId || "nicht gefunden");
      console.log("Video URL:", videoUrl || "nicht gefunden");
      console.log("======================");

      if (!stationId && !videoUrl) {
        showError("QR-Code enthält keine gültigen Daten (Station oder Video)!");
        setTimeout(() => window.location.reload(), 3000);
        return;
      }

      if (videoUrl && !isValidVideoUrl(videoUrl)) {
        showError("Ungültige Video-URL im QR-Code!");
        setTimeout(() => window.location.reload(), 3000);
        return;
      }

      if (stationId) {
        stationId = stationId.trim();
        if (!stationId.length) stationId = null;
      }

      // sessionStorage für Unity
      sessionStorage.setItem("qr_raw", decodedText);
      if (stationId) sessionStorage.setItem("stationId", stationId);
      else sessionStorage.removeItem("stationId");
      if (videoUrl) sessionStorage.setItem("videoUrl", videoUrl);
      else sessionStorage.removeItem("videoUrl");

      console.log("=== BEFORE REDIRECT - Verify Data ===");
      console.log("sessionStorage.videoUrl:", sessionStorage.getItem("videoUrl"));
      console.log("sessionStorage.stationId:", sessionStorage.getItem("stationId"));
      console.log("sessionStorage.qr_raw:", sessionStorage.getItem("qr_raw"));
      console.log("=====================================");

      setTimeout(() => {
        const params = new URLSearchParams();
        params.set("qr", "scanned");
        if (videoUrl) params.set("video", encodeURIComponent(videoUrl));
        if (stationId) params.set("station", encodeURIComponent(stationId));

        const target = `${TRACKER_PAGE}?${params.toString()}`;
        console.log("Redirecting to:", target);
        window.location.href = target;
      }, 800);
    }

    function onScanFailure(error) {
      // wird ständig getriggert, wenn kein QR im Bild ist – bewusst ruhig
    }

    async function startScanner() {
      try {
        if (!window.Html5Qrcode) {
          throw new Error("html5-qrcode Bibliothek nicht geladen.");
        }

        loadingOverlay.style.display = "flex";
        errorDiv.style.display = "none";
        frame.classList.add("scanning");

        const devices = await Html5Qrcode.getCameras();
        if (!devices || !devices.length) {
          showError("Keine Kamera gefunden.");
          return;
        }

        console.log("Gefundene Kameras:", devices);

        let backCamera = devices.find((d) =>
          d.label.toLowerCase().includes("back") ||
          d.label.toLowerCase().includes("rear") ||
          d.label.toLowerCase().includes("environment")
        );

        let cameraConfig;
        if (backCamera) {
          console.log("Back-Kamera:", backCamera.label);
          cameraConfig = { deviceId: { exact: backCamera.id } };
        } else {
          console.warn("Keine Back-Kamera im Label – nutze facingMode: environment");
          cameraConfig = { facingMode: { exact: "environment" } };
        }

        html5QrCode = new Html5Qrcode("qr-reader");

        const config = {
          fps: 10,
          qrbox: function (vw, vh) {
            const size = Math.floor(Math.min(vw, vh) * 0.6);
            return { width: size, height: size };
          },
          disableFlip: true
        };

        await html5QrCode.start(
          cameraConfig,
          config,
          onScanSuccess,
          onScanFailure
        );

        hasStarted = true;
        loadingOverlay.style.display = "none";
        console.log("Scanner gestartet (Orientation:", currentOrientation, ")");
      } catch (err) {
        console.error("Scanner init error:", err);

        let msg = "Kamera-Zugriff fehlgeschlagen.";
        if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
          msg = "Kamera-Zugriff verweigert. Bitte in den Browser-Einstellungen erlauben.";
        } else if (err.name === "NotFoundError") {
          msg = "Keine Kamera gefunden.";
        } else if (err.name === "NotReadableError") {
          msg = "Kamera wird bereits von einer anderen Anwendung verwendet.";
        } else if (err.name === "SecurityError") {
          msg = "Kamera-Zugriff nur über HTTPS möglich (außer localhost).";
        } else if (err.name === "OverconstrainedError") {
          msg = "Back-Kamera-Konfiguration wird nicht unterstützt.";
        }

        showError(msg);
      }
    }

    async function handleOrientationChange() {
      const newOrientation = isLandscape() ? "landscape" : "portrait";
      if (newOrientation === currentOrientation) return;

      currentOrientation = newOrientation;
      console.log("Orientation changed to:", currentOrientation);

      if (restartTimeout) clearTimeout(restartTimeout);

      restartTimeout = setTimeout(async () => {
        await stopScanner();
        await startScanner();
      }, 400);
    }

    window.addEventListener("load", () => {
      currentOrientation = isLandscape() ? "landscape" : "portrait";
      startScanner();
    });

    window.addEventListener("beforeunload", () => {
      stopScanner();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopScanner();
      }
    });

    window.addEventListener("orientationchange", handleOrientationChange);
    window.addEventListener("resize", handleOrientationChange);
  </script>
</body>
</html>
