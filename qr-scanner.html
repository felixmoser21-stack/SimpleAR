<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>QR-Code Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        #scanner-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        /* html5-qrcode reader container */
        #qr-reader {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Override html5-qrcode default styles */
        #qr-reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        #qr-reader__dashboard_section {
            display: none !important;
        }

        #qr-reader__camera_selection {
            display: none !important;
        }

        #scanner-info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            z-index: 1000;
            max-width: 90%;
        }

        #error-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            z-index: 1000;
            display: none;
            max-width: 90%;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 1001;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom scanning frame overlay */
        #scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        #scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 3px solid #00ff00;
            border-radius: 10px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }

        /* Corner animations */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid #00ff00;
        }

        .corner.top-left {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
            border-radius: 10px 0 0 0;
        }

        .corner.top-right {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 10px 0 0;
        }

        .corner.bottom-left {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 10px;
        }

        .corner.bottom-right {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 10px 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .scanning .corner {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Kamera wird initialisiert...</div>
    </div>

    <div id="scanner-container" style="display: none;">
        <div id="qr-reader"></div>
        <div id="scanner-overlay">
            <div id="scanner-frame" class="scanning">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
            </div>
        </div>
        <div id="scanner-info">
            Richten Sie den QR-Code auf den Rahmen
        </div>
    </div>

    <div id="error-message"></div>

    <!-- html5-qrcode Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <script>
        let html5QrCode = null;

        // Helper function to validate URL
        function isValidUrl(string) {
            try {
                const url = new URL(string);
                // Check if protocol is http or https
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        // Helper function to validate video URL
        function isValidVideoUrl(string) {
            if (!isValidUrl(string)) {
                return false;
            }
            // Check if URL ends with video extension or contains video parameter
            const videoExtensions = ['.mp4', '.webm', '.ogg', '.mov', '.avi', '.mkv'];
            const lowerUrl = string.toLowerCase();
            return videoExtensions.some(ext => lowerUrl.includes(ext));
        }

        // Success callback when QR code is detected
        function onScanSuccess(decodedText, decodedResult) {
            console.log('=== QR-Code Scan Success ===');
            console.log('Raw QR-Code:', decodedText);
            console.log('Scan Result:', decodedResult);

            // Stop scanning
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    console.log('Scanner stopped successfully');
                }).catch((err) => {
                    console.error('Error stopping scanner:', err);
                });
            }

            //----------------------------------------
            // Extract stationId & videoUrl
            //----------------------------------------

            let stationId = null;
            let videoUrl = null;

            try {
                if (decodedText.includes("http")) {
                    // Whole URL
                    const urlObj = new URL(decodedText);

                    stationId = urlObj.searchParams.get("station");
                    videoUrl = urlObj.searchParams.get("video");

                    // maybe URL IS the video
                    if (!videoUrl && (decodedText.endsWith(".mp4") || decodedText.endsWith(".mov") || decodedText.endsWith(".webm"))) {
                        videoUrl = decodedText;
                    }
                }
                else if (decodedText.includes("=")) {
                    // Only parameters
                    const params = new URLSearchParams(decodedText);
                    stationId = params.get("station");
                    videoUrl = params.get("video");
                }
                else if (decodedText.endsWith(".mp4") || decodedText.endsWith(".mov") || decodedText.endsWith(".webm")) {
                    // Direct video URL (without http)
                    videoUrl = decodedText;
                }
            } catch (err) {
                console.error("QR parsing error:", err);
            }

            //----------------------------------------
            // Logging extracted values
            //----------------------------------------

            console.log('--- Extracted Data ---');
            console.log('Station ID:', stationId || 'nicht gefunden');
            console.log('Video URL:', videoUrl || 'nicht gefunden');
            console.log('======================');

            //----------------------------------------
            // Validation
            //----------------------------------------

            // Check if at least one value was extracted
            if (!stationId && !videoUrl) {
                console.error('Validation failed: No valid data extracted from QR-Code');
                showError('QR-Code enthält keine gültigen Daten (Station oder Video)!');
                
                // Restart scanner after 3 seconds
                setTimeout(() => {
                    window.location.reload();
                }, 3000);
                return;
            }

            // Validate video URL if present
            if (videoUrl && !isValidVideoUrl(videoUrl)) {
                console.error('Validation failed: Invalid video URL:', videoUrl);
                showError('Ungültige Video-URL im QR-Code! Bitte verwenden Sie eine gültige HTTP(S) Video-URL.');
                
                // Restart scanner after 3 seconds
                setTimeout(() => {
                    window.location.reload();
                }, 3000);
                return;
            }

            // Validate station ID if present (optional: add custom validation)
            if (stationId) {
                // Trim whitespace
                stationId = stationId.trim();
                
                // Optional: Check if station ID is not empty after trim
                if (stationId.length === 0) {
                    console.warn('Warning: Station ID is empty after trim');
                    stationId = null;
                }
            }

            //----------------------------------------
            // STORE results tab-local (only valid data)
            //----------------------------------------

            // Always store raw QR-Code
            sessionStorage.setItem("qr_raw", decodedText);

            // Only store valid values (not empty strings)
            if (stationId) {
                sessionStorage.setItem("stationId", stationId);
                console.log('✓ Stored stationId:', stationId);
            } else {
                sessionStorage.removeItem("stationId");
                console.log('✗ No stationId to store');
            }

            if (videoUrl) {
                sessionStorage.setItem("videoUrl", videoUrl);
                console.log('✓ Stored videoUrl:', videoUrl);
            } else {
                sessionStorage.removeItem("videoUrl");
                console.log('✗ No videoUrl to store');
            }

            //----------------------------------------
            // UI feedback
            //----------------------------------------

            const infoDiv = document.getElementById('scanner-info');
            
            // Show what was found
            let successMessage = 'QR-Code erfolgreich gescannt!';
            if (stationId && videoUrl) {
                successMessage += ` (Station: ${stationId})`;
            } else if (stationId) {
                successMessage += ` (Station: ${stationId})`;
            } else if (videoUrl) {
                successMessage += ' (Video gefunden)';
            }
            
            infoDiv.textContent = successMessage;
            infoDiv.style.background = 'rgba(0, 255, 0, 0.8)';

            document.getElementById('scanner-frame').classList.remove('scanning');

            console.log('=== Scan Complete - Redirecting ===');

            //----------------------------------------
            // Redirect to Unity loader
            //----------------------------------------

            // WICHTIG: Daten nochmal bestätigen vor Redirect
            console.log('=== BEFORE REDIRECT - Verify Data ===');
            console.log('sessionStorage.videoUrl:', sessionStorage.getItem('videoUrl'));
            console.log('sessionStorage.stationId:', sessionStorage.getItem('stationId'));
            console.log('sessionStorage.qr_raw:', sessionStorage.getItem('qr_raw'));
            console.log('
        }

        // Error callback (optional, for debugging)
        function onScanFailure(error) {
            // This is called very frequently, so we don't log it
            // console.warn('QR scan error:', error);
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }

        // Initialize scanner
        async function initScanner() {
            try {
                // Create Html5Qrcode instance
                html5QrCode = new Html5Qrcode("qr-reader");

                // Get available cameras
                const devices = await Html5Qrcode.getCameras();
                
                if (devices && devices.length > 0) {
                    console.log('Available cameras:', devices);

                    // Try to find back camera (environment facing)
                    let cameraId = devices[0].id;
                    
                    // Look for back camera
                    const backCamera = devices.find(device => 
                        device.label.toLowerCase().includes('back') ||
                        device.label.toLowerCase().includes('rear') ||
                        device.label.toLowerCase().includes('environment')
                    );
                    
                    if (backCamera) {
                        cameraId = backCamera.id;
                        console.log('Using back camera:', backCamera.label);
                    } else {
                        console.log('Using default camera:', devices[0].label);
                    }

                    // Hide loading, show scanner
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('scanner-container').style.display = 'flex';

                    // Start scanning with optimized config
                    const config = {
                        fps: 10,    // Frames per second for scanning
                        qrbox: {    // Scanning box dimensions
                            width: 250,
                            height: 250
                        },
                        aspectRatio: 1.0,
                        disableFlip: false,
                        videoConstraints: {
                            facingMode: { ideal: "environment" },
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    };

                    await html5QrCode.start(
                        cameraId,
                        config,
                        onScanSuccess,
                        onScanFailure
                    );

                    console.log('Scanner started successfully');

                } else {
                    showError('Keine Kamera gefunden. Bitte stellen Sie sicher, dass Ihr Gerät eine Kamera hat.');
                }

            } catch (error) {
                console.error('Scanner initialization error:', error);
                
                let errorMessage = 'Kamera-Zugriff fehlgeschlagen.';
                
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    errorMessage = 'Kamera-Zugriff verweigert. Bitte erlauben Sie den Kamera-Zugriff in Ihren Browser-Einstellungen.';
                } else if (error.name === 'NotFoundError') {
                    errorMessage = 'Keine Kamera gefunden. Bitte stellen Sie sicher, dass Ihr Gerät eine Kamera hat.';
                } else if (error.name === 'NotReadableError') {
                    errorMessage = 'Kamera wird bereits von einer anderen Anwendung verwendet.';
                } else if (error.name === 'OverconstrainedError') {
                    errorMessage = 'Kamera-Einstellungen werden nicht unterstützt.';
                } else if (error.name === 'SecurityError') {
                    errorMessage = 'Kamera-Zugriff nur über HTTPS möglich (außer localhost).';
                }
                
                showError(errorMessage);
            }
        }

        // Start scanner when page loads
        window.addEventListener('load', () => {
            // Small delay to ensure DOM is fully ready
            setTimeout(initScanner, 100);
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (html5QrCode) {
                html5QrCode.stop().catch(err => {
                    console.error('Error stopping scanner on unload:', err);
                });
            }
        });

        // Handle page visibility change (pause/resume scanning)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Page is hidden, pause scanning
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.pause();
                }
            } else {
                // Page is visible, resume scanning
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.resume();
                }
            }
        });
    </script>
</body>
</html>
