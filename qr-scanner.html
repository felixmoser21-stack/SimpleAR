<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>QR-Code Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        #scanner-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        /* html5-qrcode reader container */
        #qr-reader {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Override html5-qrcode default styles */
        #qr-reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        #qr-reader__dashboard_section {
            display: none !important;
        }

        #qr-reader__camera_selection {
            display: none !important;
        }

        #scanner-info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            z-index: 1000;
            max-width: 90%;
        }

        #error-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            z-index: 1000;
            display: none;
            max-width: 90%;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 1001;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom scanning frame overlay */
        #scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        #scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 3px solid #00ff00;
            border-radius: 10px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }

        /* Corner animations */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid #00ff00;
        }

        .corner.top-left {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
            border-radius: 10px 0 0 0;
        }

        .corner.top-right {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 10px 0 0;
        }

        .corner.bottom-left {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 10px;
        }

        .corner.bottom-right {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 10px 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .scanning .corner {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Kamera wird initialisiert...</div>
    </div>

    <div id="scanner-container" style="display: none;">
        <div id="qr-reader"></div>
        <div id="scanner-overlay">
            <div id="scanner-frame" class="scanning">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
            </div>
        </div>
        <div id="scanner-info">
            Richten Sie den QR-Code auf den Rahmen
        </div>
    </div>

    <div id="error-message"></div>

    <!-- html5-qrcode Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <script>
        let html5QrCode = null;

        // Success callback when QR code is detected
        function onScanSuccess(decodedText, decodedResult) {
            console.log('QR-Code detected:', decodedText);
            console.log('Decoded result:', decodedResult);

            // Stop scanning
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    console.log('Scanner stopped successfully');
                }).catch((err) => {
                    console.error('Error stopping scanner:', err);
                });
            }

            // Store QR content in sessionStorage (instance-specific)
            sessionStorage.setItem('qrCodeContent', decodedText);

            // Show success message
            const infoDiv = document.getElementById('scanner-info');
            infoDiv.textContent = 'QR-Code erfolgreich gescannt!';
            infoDiv.style.background = 'rgba(0, 255, 0, 0.8)';

            // Remove scanning animation
            document.getElementById('scanner-frame').classList.remove('scanning');

            // Redirect to AR tracker after short delay
            setTimeout(() => {
                window.location.href = 'index_tracker.html?qr=scanned';
            }, 1000);
        }

        // Error callback (optional, for debugging)
        function onScanFailure(error) {
            // This is called very frequently, so we don't log it
            // console.warn('QR scan error:', error);
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }

        // Initialize scanner
        async function initScanner() {
            try {
                // Create Html5Qrcode instance
                html5QrCode = new Html5Qrcode("qr-reader");

                // Get available cameras
                const devices = await Html5Qrcode.getCameras();
                
                if (devices && devices.length > 0) {
                    console.log('Available cameras:', devices);

                    // Try to find back camera (environment facing)
                    let cameraId = devices[0].id;
                    
                    // Look for back camera
                    const backCamera = devices.find(device => 
                        device.label.toLowerCase().includes('back') ||
                        device.label.toLowerCase().includes('rear') ||
                        device.label.toLowerCase().includes('environment')
                    );
                    
                    if (backCamera) {
                        cameraId = backCamera.id;
                        console.log('Using back camera:', backCamera.label);
                    } else {
                        console.log('Using default camera:', devices[0].label);
                    }

                    // Hide loading, show scanner
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('scanner-container').style.display = 'flex';

                    // Start scanning with optimized config
                    const config = {
                        fps: 10,    // Frames per second for scanning
                        qrbox: {    // Scanning box dimensions
                            width: 250,
                            height: 250
                        },
                        aspectRatio: 1.0,
                        disableFlip: false,
                        videoConstraints: {
                            facingMode: { ideal: "environment" },
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    };

                    await html5QrCode.start(
                        cameraId,
                        config,
                        onScanSuccess,
                        onScanFailure
                    );

                    console.log('Scanner started successfully');

                } else {
                    showError('Keine Kamera gefunden. Bitte stellen Sie sicher, dass Ihr Gerät eine Kamera hat.');
                }

            } catch (error) {
                console.error('Scanner initialization error:', error);
                
                let errorMessage = 'Kamera-Zugriff fehlgeschlagen.';
                
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    errorMessage = 'Kamera-Zugriff verweigert. Bitte erlauben Sie den Kamera-Zugriff in Ihren Browser-Einstellungen.';
                } else if (error.name === 'NotFoundError') {
                    errorMessage = 'Keine Kamera gefunden. Bitte stellen Sie sicher, dass Ihr Gerät eine Kamera hat.';
                } else if (error.name === 'NotReadableError') {
                    errorMessage = 'Kamera wird bereits von einer anderen Anwendung verwendet.';
                } else if (error.name === 'OverconstrainedError') {
                    errorMessage = 'Kamera-Einstellungen werden nicht unterstützt.';
                } else if (error.name === 'SecurityError') {
                    errorMessage = 'Kamera-Zugriff nur über HTTPS möglich (außer localhost).';
                }
                
                showError(errorMessage);
            }
        }

        // Start scanner when page loads
        window.addEventListener('load', () => {
            // Small delay to ensure DOM is fully ready
            setTimeout(initScanner, 100);
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (html5QrCode) {
                html5QrCode.stop().catch(err => {
                    console.error('Error stopping scanner on unload:', err);
                });
            }
        });

        // Handle page visibility change (pause/resume scanning)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Page is hidden, pause scanning
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.pause();
                }
            } else {
                // Page is visible, resume scanning
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.resume();
                }
            }
        });
    </script>
</body>
</html>
