<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>QR-Code Scanner (Debug)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        #scanner-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #qr-video-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #qr-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #scanner-info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            z-index: 1000;
            max-width: 90%;
        }

        #error-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            z-index: 1000;
            display: none;
            max-width: 90%;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 1001;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Overlay */
        #scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        #scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 3px solid #00ff00;
            border-radius: 10px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }

        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid #00ff00;
        }

        .corner.top-left {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
            border-radius: 10px 0 0 0;
        }

        .corner.top-right {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 10px 0 0;
        }

        .corner.bottom-left {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 10px;
        }

        .corner.bottom-right {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 10px 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .scanning .corner {
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Debug-Overlay unten */
        #debug-log {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            max-height: 40vh;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.75);
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            z-index: 1200;
            padding: 6px 8px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Kamera wird initialisiert...</div>
    </div>

    <div id="scanner-container" style="display: none;">
        <div id="qr-video-wrapper">
            <video id="qr-video" muted playsinline></video>
        </div>

        <div id="scanner-overlay">
            <div id="scanner-frame" class="scanning">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
            </div>
        </div>

        <div id="scanner-info">
            Richten Sie den QR-Code auf den Rahmen
        </div>
    </div>

    <div id="error-message"></div>

    <!-- Debug-Ausgabe -->
    <div id="debug-log"></div>

    <!-- qr-scanner Library -->
    <script src="https://unpkg.com/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
    <script>
        // Worker-Pfad für qr-scanner
        QrScanner.WORKER_PATH = 'https://unpkg.com/qr-scanner@1.4.2/qr-scanner-worker.min.js';

        let qrScanner = null;
        let orientationChangeTimeout = null;
        let isRestarting = false;
        let hasScanned = false; // verhindert mehrfaches Auslösen

        function logDebug(...args) {
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
            console.log('[DEBUG]', msg);
            const debugDiv = document.getElementById('debug-log');
            if (debugDiv) {
                debugDiv.textContent += msg + '\n';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
            logDebug('ERROR:', message);
        }

        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        // Entspannter Video-URL-Check: nur "ist es eine HTTP/HTTPS-URL?"
        function isValidVideoUrl(string) {
            return isValidUrl(string);
        }

        // === Scan-Erfolgslogik inkl. Debug & URL-Übergabe zu index_tracker.html ===
        function handleDecoded(decodedText) {
            if (hasScanned) {
                logDebug('Scan already handled, ignore further results.');
                return;
            }
            hasScanned = true;

            logDebug('=== QR-Code Scan Success ===');
            logDebug('Raw decodedText:', decodedText);

            let stationId = null;
            let videoUrl = null;

            try {
                if (decodedText.includes("http")) {
                    const urlObj = new URL(decodedText);
                    stationId = urlObj.searchParams.get("station");
                    videoUrl = urlObj.searchParams.get("video");
                    logDebug('Parsed as full URL:', {
                        href: urlObj.href,
                        stationFromParams: stationId,
                        videoFromParams: videoUrl
                    });

                    // Fallback: QR enthält direkt eine Video-URL ohne video-Parameter
                    if (!videoUrl && (
                        decodedText.endsWith(".mp4") ||
                        decodedText.endsWith(".mov") ||
                        decodedText.endsWith(".webm")
                    )) {
                        videoUrl = decodedText;
                        logDebug('Fallback: videoUrl directly from decodedText (file extension match).');
                    }
                } else if (decodedText.includes("=")) {
                    // Nur Query-Style: station=...&video=...
                    const params = new URLSearchParams(decodedText);
                    stationId = params.get("station");
                    videoUrl = params.get("video");
                    logDebug('Parsed as query string:', {
                        stationFromParams: stationId,
                        videoFromParams: videoUrl
                    });
                } else if (
                    decodedText.endsWith(".mp4") ||
                    decodedText.endsWith(".mov") ||
                    decodedText.endsWith(".webm")
                ) {
                    videoUrl = decodedText;
                    logDebug('Fallback (bare video path): videoUrl:', videoUrl);
                }
            } catch (err) {
                console.error("QR parsing error:", err);
                logDebug('QR parsing error:', err.message || err.toString());
            }

            logDebug('--- Extracted Data ---');
            logDebug('Station ID (raw):', stationId);
            logDebug('Video URL (raw):', videoUrl);

            if (stationId) {
                stationId = stationId.trim();
                if (!stationId) stationId = null;
            }

            logDebug('Station ID (trimmed):', stationId);
            logDebug('Video URL (final candidate):', videoUrl);

            // Debug: falls gar nichts Sinnvolles
            if (!stationId && !videoUrl) {
                showError('QR-Code enthält keine gültigen Daten (Station oder Video)!');
                logDebug('Validation: FAILED - neither stationId nor videoUrl present.');
                setTimeout(() => window.location.reload(), 4000);
                return;
            }

            if (videoUrl) {
                const isValid = isValidVideoUrl(videoUrl);
                logDebug('Video URL valid?', isValid, 'Video URL:', videoUrl);
                if (!isValid) {
                    showError('Ungültige Video-URL im QR-Code: ' + videoUrl);
                    setTimeout(() => window.location.reload(), 4000);
                    return;
                }
            } else {
                logDebug('No videoUrl provided in QR (this may be okay if only stationId is needed).');
            }

            // sessionStorage wie gehabt
            sessionStorage.setItem("qr_raw", decodedText);
            logDebug('sessionStorage.qr_raw =', sessionStorage.getItem('qr_raw'));

            if (stationId) {
                sessionStorage.setItem("stationId", stationId);
            } else {
                sessionStorage.removeItem("stationId");
            }
            if (videoUrl) {
                sessionStorage.setItem("videoUrl", videoUrl);
            } else {
                sessionStorage.removeItem("videoUrl");
            }

            logDebug('sessionStorage.stationId =', sessionStorage.getItem('stationId'));
            logDebug('sessionStorage.videoUrl =', sessionStorage.getItem('videoUrl'));

            const infoDiv = document.getElementById('scanner-info');
            let successMessage = 'QR-Code erfolgreich gescannt!';
            if (stationId && videoUrl) {
                successMessage += ` (Station: ${stationId})`;
            } else if (stationId) {
                successMessage += ` (Station: ${stationId})`;
            } else if (videoUrl) {
                successMessage += ' (Video gefunden)';
            }

            infoDiv.textContent = successMessage;
            infoDiv.style.background = 'rgba(0, 255, 0, 0.8)';
            document.getElementById('scanner-frame').classList.remove('scanning');

            logDebug('Prepared success UI message:', successMessage);

            // Redirect in 1 Sekunde
            setTimeout(() => {
                const params = new URLSearchParams();
                params.set('qr', 'scanned');
                if (videoUrl) params.set('video', videoUrl);     // kein doppeltes encode
                if (stationId) params.set('station', stationId); // kein doppeltes encode

                const redirectUrl = 'index_tracker.html?' + params.toString();
                logDebug('Redirect URL =', redirectUrl);
                console.log('Redirecting to:', redirectUrl);
                window.location.href = redirectUrl;
            }, 1000);
        }

        async function initScanner() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('scanner-container');
            const videoElem = document.getElementById('qr-video');

            try {
                logDebug('Initializing qr-scanner...');
                loading.style.display = 'block';
                container.style.display = 'flex';

                hasScanned = false; // bei jedem Init zurücksetzen

                if (!qrScanner) {
                    qrScanner = new QrScanner(
                        videoElem,
                        result => {
                            logDebug('Decoded result from qr-scanner callback:', result);
                            handleDecoded(result); // result = QR-Text
                        },
                        {
                            preferredCamera: 'environment',
                            highlightScanRegion: false,
                            highlightCodeOutline: false
                        }
                    );
                }

                await qrScanner.start();
                logDebug('qr-scanner started successfully.');
                loading.style.display = 'none';
            } catch (err) {
                console.error('qr-scanner init error:', err);
                logDebug('qr-scanner init error:', err.message || err.toString());
                loading.style.display = 'none';
                showError('Kamera-Zugriff fehlgeschlagen. Bitte HTTPS & Kameraberechtigung prüfen.');
            }
        }

        async function restartScanner() {
            if (isRestarting) {
                logDebug('Already restarting, skip...');
                return;
            }
            isRestarting = true;
            logDebug('Restarting qr-scanner (orientation change)...');

            try {
                if (qrScanner) {
                    await qrScanner.stop();
                    logDebug('qr-scanner stopped for restart.');
                }
            } catch (e) {
                console.warn('Error stopping on restart:', e);
                logDebug('Error stopping on restart:', e.message || e.toString());
            }

            try {
                await initScanner();
            } finally {
                isRestarting = false;
            }
        }

        function handleOrientationChange() {
            logDebug('Orientation/resize event detected (qr-scanner)');

            if (orientationChangeTimeout) {
                clearTimeout(orientationChangeTimeout);
            }

            // Einfach Stop + Start, Browser kümmert sich um Rotation
            orientationChangeTimeout = setTimeout(() => {
                logDebug('Orientation stabilized, restarting qr-scanner...');
                restartScanner();
            }, 500);
        }

        window.addEventListener('load', () => {
            logDebug('Page loaded, starting qr-scanner...');
            initScanner();
        });

        window.addEventListener('beforeunload', () => {
            if (qrScanner) {
                qrScanner.stop();
                logDebug('qr-scanner stopped on beforeunload.');
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (!qrScanner) return;

            if (document.hidden) {
                qrScanner.pause();
                logDebug('Document hidden: qr-scanner paused.');
            } else {
                qrScanner.resume();
                logDebug('Document visible: qr-scanner resumed.');
            }
        });

        window.addEventListener('orientationchange', handleOrientationChange);
        window.addEventListener('resize', handleOrientationChange);
        if (screen.orientation) {
            screen.orientation.addEventListener('change', handleOrientationChange);
        }
    </script>
</body>
</html>
