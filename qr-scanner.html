<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>QR-Scanner</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    #loading,
    #error {
      text-align: center;
      padding: 0.75rem;
      font-size: 0.95rem;
    }

    #error {
      display: none;
      background: #330000;
      color: #ff8080;
    }

    #scanner-container {
      position: relative;
      width: 100%;
      height: calc(100% - 90px); /* Platz für Infos unten */
      overflow: hidden;
      background: #000;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #overlay {
      position: absolute;
      inset: 0;
      border: 2px solid rgba(0, 255, 0, 0.6);
      margin: 12%;
      border-radius: 12px;
      pointer-events: none;
    }

    #info {
      padding: 0.5rem 0.75rem 1rem;
      font-size: 0.9rem;
      border-top: 1px solid #333;
      background: #050505;
    }

    #result {
      font-weight: 600;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <!-- Statusmeldungen -->
  <div id="loading">Scanner wird initialisiert…</div>
  <div id="error"></div>

  <!-- Kamera-Bereich -->
  <div id="scanner-container">
    <video
      id="video"
      playsinline
      autoplay
      muted
    ></video>
    <canvas id="canvas" style="display: none;"></canvas>
    <div id="overlay"></div>
  </div>

  <!-- Ergebnis / Debug-Infos -->
  <div id="info">
    <div>Gefundener QR-Code:</div>
    <div id="result">Noch kein Code erkannt.</div>
  </div>

  <script>
    console.log("Page loaded, starting scanner...");

    const loading = document.getElementById("loading");
    const errorDiv = document.getElementById("error");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const resultDiv = document.getElementById("result");

    const ctx = canvas.getContext("2d");
    const hasBarcodeDetector =
      "BarcodeDetector" in window &&
      BarcodeDetector.getSupportedFormats &&
      BarcodeDetector.getSupportedFormats().then
        ? true
        : "BarcodeDetector" in window;

    let detector = null;
    if (hasBarcodeDetector && window.BarcodeDetector) {
      try {
        detector = new BarcodeDetector({ formats: ["qr_code"] });
        console.log("BarcodeDetector initialisiert.");
      } catch (e) {
        console.warn("BarcodeDetector nicht verfügbar:", e);
      }
    } else {
      console.warn("BarcodeDetector wird von diesem Browser nicht unterstützt.");
    }

    let currentStream = null;
    let scanning = false;
    let orientationTimeout = null;

    function showError(message, error) {
      console.error("Scanner error:", message, error || "");
      loading.style.display = "none";
      errorDiv.style.display = "block";
      errorDiv.textContent =
        message + (error && error.message ? " – " + error.message : "");
    }

    async function startScanner() {
      console.log("Initializing scanner...");
      loading.style.display = "block";
      errorDiv.style.display = "none";
      errorDiv.textContent = "";

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Kamera-Zugriff nicht unterstützt.");
        }

        // Bestehenden Stream stoppen
        stopScanner();

        const constraints = {
          video: {
            facingMode: { ideal: "environment" },
          },
          audio: false,
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream;
        video.srcObject = stream;

        await video.play();

        loading.style.display = "none";
        scanning = true;
        scanLoop();
      } catch (err) {
        showError("Fehler beim Starten des Scanners", err);
      }
    }

    function stopScanner() {
      if (currentStream) {
        console.log("Stopping current camera stream...");
        currentStream.getTracks().forEach((t) => t.stop());
        currentStream = null;
      }
      scanning = false;
    }

    async function restartScanner() {
      console.log("Restarting scanner...");
      stopScanner();
      await startScanner();
    }

    async function scanLoop() {
      if (!scanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const vw = video.videoWidth;
        const vh = video.videoHeight;

        if (vw && vh) {
          canvas.width = vw;
          canvas.height = vh;
          ctx.drawImage(video, 0, 0, vw, vh);

          if (detector) {
            try {
              const bitmap = await createImageBitmap(canvas);
              const codes = await detector.detect(bitmap);
              bitmap.close();

              if (codes && codes.length > 0) {
                const value = codes[0].rawValue || codes[0].rawValue;
                resultDiv.textContent = value;
              }
            } catch (e) {
              // Nicht kritisch, einfach im Log halten
              console.log("Detect error (ignoriere einmalig):", e);
            }
          }
        }
      }

      requestAnimationFrame(scanLoop);
    }

    function handleOrientationOrResize() {
      console.log("Orientation/resize event detected");
      if (orientationTimeout) clearTimeout(orientationTimeout);

      orientationTimeout = setTimeout(() => {
        console.log("Orientation stabilized, restarting scanner...");
        restartScanner().catch((err) =>
          console.error("Error re-initializing scanner:", err)
        );
      }, 500);
    }

    window.addEventListener("load", () => {
      startScanner().catch((err) =>
        showError("Fehler bei der Initialisierung", err)
      );
    });

    window.addEventListener("resize", handleOrientationOrResize);
    window.addEventListener("orientationchange", handleOrientationOrResize);
  </script>
</body>
</html>
