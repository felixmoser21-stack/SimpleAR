<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>QR-Code Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        #scanner-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        /* html5-qrcode reader container */
        #qr-reader {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Override html5-qrcode default styles */
        #qr-reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            /* Fix für Safari Landscape-Orientierung */
            transform: none !important;
            -webkit-transform: none !important;
            image-orientation: from-image !important;
        }

        /* Landscape-spezifische Fixes - AUSKOMMENTIERT */
        /* @media screen and (orientation: landscape) {
            #qr-reader video {
                width: 100vw !important;
                height: 100vh !important;
                object-fit: cover !important;
                transform: none !important;
                -webkit-transform: none !important;
            }
            
            #qr-reader {
                width: 100vw !important;
                height: 100vh !important;
            }
            
            #scanner-frame {
                width: 200px;
                height: 200px;
            }
        } */

        /* Fix für html5-qrcode interne Container */
        #qr-reader__scan_region {
            min-height: 100% !important;
            overflow: hidden !important;
        }
        
        #qr-reader__scan_region video {
            object-fit: cover !important;
            transform: none !important;
            -webkit-transform: none !important;
        }

        #qr-reader__dashboard_section {
            display: none !important;
        }

        #qr-reader__camera_selection {
            display: none !important;
        }

        #scanner-info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            z-index: 1000;
            max-width: 90%;
        }

        #error-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            z-index: 1000;
            display: none;
            max-width: 90%;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 1001;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom scanning frame overlay */
        #scanner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        #scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 3px solid #00ff00;
            border-radius: 10px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }

        /* Corner animations */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid #00ff00;
        }

        .corner.top-left {
            top: -3px;
            left: -3px;
            border-right: none;
            border-bottom: none;
            border-radius: 10px 0 0 0;
        }

        .corner.top-right {
            top: -3px;
            right: -3px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 10px 0 0;
        }

        .corner.bottom-left {
            bottom: -3px;
            left: -3px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 10px;
        }

        .corner.bottom-right {
            bottom: -3px;
            right: -3px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 10px 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .scanning .corner {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Kamera wird initialisiert...</div>
    </div>

    <div id="scanner-container" style="display: none;">
        <div id="qr-reader"></div>
        <div id="scanner-overlay">
            <div id="scanner-frame" class="scanning">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
            </div>
        </div>
        <div id="scanner-info">
            Richten Sie den QR-Code auf den Rahmen
        </div>
    </div>

    <div id="error-message"></div>

    <!-- html5-qrcode Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <script>
        let html5QrCode = null;
        let currentOrientation = null;
        let isRestarting = false;

        // Erkennt ob Gerät im Landscape-Modus ist
        function isLandscape() {
            return window.innerWidth > window.innerHeight;
        }

        // Gibt die optimalen Video-Constraints basierend auf Orientierung zurück
        function getVideoConstraints() {
            const landscape = isLandscape();
            console.log('Orientation:', landscape ? 'LANDSCAPE' : 'PORTRAIT');
            
            if (landscape) {
                // Im Landscape: Breite > Höhe anfordern
                return {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1920, min: 1280 },
                    height: { ideal: 1080, min: 720 }
                };
            } else {
                // Im Portrait: Höhe > Breite anfordern - KEINE festen Constraints
                return {
                    facingMode: { ideal: "environment" }
                };
            }
        }

        // Startet Scanner mit aktueller Orientierung neu
        async function restartScanner() {
            if (isRestarting) {
                console.log('Already restarting, skipping...');
                return;
            }
            
            isRestarting = true;
            console.log('Restarting scanner for orientation change...');
            
            try {
                if (html5QrCode && html5QrCode.isScanning) {
                    await html5QrCode.stop();
                    console.log('Scanner stopped for restart');
                }
                
                // Kurze Pause für Kamera-Freigabe
                await new Promise(resolve => setTimeout(resolve, 300));
                
                // Scanner neu initialisieren
                await initScanner();
                
            } catch (err) {
                console.error('Error restarting scanner:', err);
            } finally {
                isRestarting = false;
            }
        }

        // Helper function to validate URL
        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        // Helper function to validate video URL
        function isValidVideoUrl(string) {
            if (!isValidUrl(string)) {
                return false;
            }
            const videoExtensions = ['.mp4', '.webm', '.ogg', '.mov', '.avi', '.mkv'];
            const lowerUrl = string.toLowerCase();
            return videoExtensions.some(ext => lowerUrl.includes(ext));
        }

        // Success callback when QR code is detected
        function onScanSuccess(decodedText, decodedResult) {
            console.log('=== QR-Code Scan Success ===');
            console.log('Raw QR-Code:', decodedText);
            console.log('Scan Result:', decodedResult);

            // Stop scanning
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    console.log('Scanner stopped successfully');
                }).catch((err) => {
                    console.error('Error stopping scanner:', err);
                });
            }

            // Extract stationId & videoUrl
            let stationId = null;
            let videoUrl = null;

            try {
                if (decodedText.includes("http")) {
                    const urlObj = new URL(decodedText);
                    stationId = urlObj.searchParams.get("station");
                    videoUrl = urlObj.searchParams.get("video");

                    if (!videoUrl && (decodedText.endsWith(".mp4") || decodedText.endsWith(".mov") || decodedText.endsWith(".webm"))) {
                        videoUrl = decodedText;
                    }
                }
                else if (decodedText.includes("=")) {
                    const params = new URLSearchParams(decodedText);
                    stationId = params.get("station");
                    videoUrl = params.get("video");
                }
                else if (decodedText.endsWith(".mp4") || decodedText.endsWith(".mov") || decodedText.endsWith(".webm")) {
                    videoUrl = decodedText;
                }
            } catch (err) {
                console.error("QR parsing error:", err);
            }

            console.log('--- Extracted Data ---');
            console.log('Station ID:', stationId || 'nicht gefunden');
            console.log('Video URL:', videoUrl || 'nicht gefunden');
            console.log('======================');

            // Validation
            if (!stationId && !videoUrl) {
                console.error('Validation failed: No valid data extracted from QR-Code');
                showError('QR-Code enthält keine gültigen Daten (Station oder Video)!');
                setTimeout(() => window.location.reload(), 3000);
                return;
            }

            if (videoUrl && !isValidVideoUrl(videoUrl)) {
                console.error('Validation failed: Invalid video URL:', videoUrl);
                showError('Ungültige Video-URL im QR-Code! Bitte verwenden Sie eine gültige HTTP(S) Video-URL.');
                setTimeout(() => window.location.reload(), 3000);
                return;
            }

            if (stationId) {
                stationId = stationId.trim();
                if (stationId.length === 0) {
                    console.warn('Warning: Station ID is empty after trim');
                    stationId = null;
                }
            }

            // STORE results in sessionStorage
            sessionStorage.setItem("qr_raw", decodedText);

            if (stationId) {
                sessionStorage.setItem("stationId", stationId);
                console.log('✓ Stored stationId:', stationId);
            } else {
                sessionStorage.removeItem("stationId");
                console.log('✗ No stationId to store');
            }

            if (videoUrl) {
                sessionStorage.setItem("videoUrl", videoUrl);
                console.log('✓ Stored videoUrl:', videoUrl);
            } else {
                sessionStorage.removeItem("videoUrl");
                console.log('✗ No videoUrl to store');
            }

            // UI feedback
            const infoDiv = document.getElementById('scanner-info');
            let successMessage = 'QR-Code erfolgreich gescannt!';
            if (stationId && videoUrl) {
                successMessage += ` (Station: ${stationId})`;
            } else if (stationId) {
                successMessage += ` (Station: ${stationId})`;
            } else if (videoUrl) {
                successMessage += ' (Video gefunden)';
            }
            
            infoDiv.textContent = successMessage;
            infoDiv.style.background = 'rgba(0, 255, 0, 0.8)';
            document.getElementById('scanner-frame').classList.remove('scanning');

            console.log('=== Scan Complete - Redirecting ===');

            // Verify data before redirect
            console.log('=== BEFORE REDIRECT - Verify Data ===');
            console.log('sessionStorage.videoUrl:', sessionStorage.getItem('videoUrl'));
            console.log('sessionStorage.stationId:', sessionStorage.getItem('stationId'));
            console.log('sessionStorage.qr_raw:', sessionStorage.getItem('qr_raw'));
            console.log('=====================================');

            // Redirect with URL parameters as fallback
            setTimeout(() => {
                const params = new URLSearchParams();
                params.set('qr', 'scanned');
                
                if (videoUrl) {
                    params.set('video', encodeURIComponent(videoUrl));
                }
                if (stationId) {
                    params.set('station', encodeURIComponent(stationId));
                }
                
                const redirectUrl = 'index_tracker.html?' + params.toString();
                console.log('Redirecting to:', redirectUrl);
                
                window.location.href = redirectUrl;
            }, 1000);
        }

        // Error callback
        function onScanFailure(error) {
            // Called frequently, don't log
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }

        // Initialize scanner
        async function initScanner() {
            try {
                // Aktuelle Orientierung speichern
                currentOrientation = isLandscape() ? 'landscape' : 'portrait';
                console.log('Initializing scanner in', currentOrientation, 'mode');
                
                // Falls html5QrCode bereits existiert, neues Objekt erstellen
                if (html5QrCode) {
                    try {
                        await html5QrCode.stop();
                    } catch (e) {
                        // Ignorieren wenn bereits gestoppt
                    }
                }
                
                html5QrCode = new Html5Qrcode("qr-reader");
                const devices = await Html5Qrcode.getCameras();
                
                if (devices && devices.length > 0) {
                    console.log('Available cameras:', devices);

                    let cameraId = devices[0].id;
                    
                    const backCamera = devices.find(device => 
                        device.label.toLowerCase().includes('back') ||
                        device.label.toLowerCase().includes('rear') ||
                        device.label.toLowerCase().includes('environment')
                    );
                    
                    if (backCamera) {
                        cameraId = backCamera.id;
                        console.log('Using back camera:', backCamera.label);
                    } else {
                        console.log('Using default camera:', devices[0].label);
                    }

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('scanner-container').style.display = 'flex';

                    // Dynamische QR-Box Größe basierend auf Orientierung
                    const qrBoxSize = isLandscape() ? 200 : 250;
                    
                    // Dynamische Video-Constraints basierend auf Orientierung
                    const videoConstraints = getVideoConstraints();
                    console.log('Using video constraints:', videoConstraints);

                    const config = {
                        fps: 10,
                        qrbox: { width: qrBoxSize, height: qrBoxSize },
                        // Kein festes aspectRatio - lassen wir die Kamera entscheiden
                        disableFlip: false,
                        videoConstraints: videoConstraints
                    };

                    await html5QrCode.start(cameraId, config, onScanSuccess, onScanFailure);
                    console.log('Scanner started successfully in', currentOrientation, 'mode');
                    
                    // Nach Start: Video-Element Styles korrigieren für Android
                    setTimeout(() => {
                        fixVideoOrientation();
                    }, 100);

                } else {
                    showError('Keine Kamera gefunden. Bitte stellen Sie sicher, dass Ihr Gerät eine Kamera hat.');
                }

            } catch (error) {
                console.error('Scanner initialization error:', error);
                
                let errorMessage = 'Kamera-Zugriff fehlgeschlagen.';
                
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    errorMessage = 'Kamera-Zugriff verweigert. Bitte erlauben Sie den Kamera-Zugriff in Ihren Browser-Einstellungen.';
                } else if (error.name === 'NotFoundError') {
                    errorMessage = 'Keine Kamera gefunden. Bitte stellen Sie sicher, dass Ihr Gerät eine Kamera hat.';
                } else if (error.name === 'NotReadableError') {
                    errorMessage = 'Kamera wird bereits von einer anderen Anwendung verwendet.';
                } else if (error.name === 'OverconstrainedError') {
                    // Bei OverconstrainedError: Fallback ohne spezifische Constraints
                    console.warn('OverconstrainedError - trying fallback constraints');
                    try {
                        const fallbackConfig = {
                            fps: 10,
                            qrbox: { width: 200, height: 200 },
                            videoConstraints: {
                                facingMode: "environment"
                            }
                        };
                        await html5QrCode.start({ facingMode: "environment" }, fallbackConfig, onScanSuccess, onScanFailure);
                        console.log('Scanner started with fallback constraints');
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('scanner-container').style.display = 'flex';
                        return;
                    } catch (fallbackError) {
                        console.error('Fallback also failed:', fallbackError);
                    }
                    errorMessage = 'Kamera-Einstellungen werden nicht unterstützt.';
                } else if (error.name === 'SecurityError') {
                    errorMessage = 'Kamera-Zugriff nur über HTTPS möglich (außer localhost).';
                }
                
                showError(errorMessage);
            }
        }
        
        // Korrigiert Video-Orientierung nach dem Start (Safari/Android Fix)
        function fixVideoOrientation() {
            const video = document.querySelector('#qr-reader video');
            const qrReader = document.querySelector('#qr-reader');
            
            if (video && qrReader) {
                console.log('Fixing video orientation...');
                console.log('Video dimensions:', video.videoWidth, 'x', video.videoHeight);
                console.log('Window dimensions:', window.innerWidth, 'x', window.innerHeight);
                
                // Reset alle Styles
                video.style.width = '100%';
                video.style.height = '100%';
                video.style.objectFit = 'cover';
                video.style.transform = 'none';
                video.style.zoom = '1';
                video.style.scale = '1';
                
                // QR-Reader Container auch resetten
                qrReader.style.width = '100%';
                qrReader.style.height = '100%';
                qrReader.style.zoom = '1';
                qrReader.style.scale = '1';
                qrReader.style.transform = 'none';
                
                // Für Android: Prüfe ob Video-Dimensionen zur Orientierung passen
                const isVideoLandscape = video.videoWidth > video.videoHeight;
                const isScreenLandscape = isLandscape();
                
                console.log('Video is landscape:', isVideoLandscape);
                console.log('Screen is landscape:', isScreenLandscape);
                
                // Wenn Video und Screen unterschiedliche Orientierung haben
                // (passiert manchmal auf Android), CSS-Rotation anwenden
                if (isVideoLandscape !== isScreenLandscape && video.videoWidth > 0) {
                    console.log('Orientation mismatch detected - applying CSS fix');
                    // Nicht rotieren, sondern object-fit anpassen
                    video.style.objectFit = 'cover';
                }
            }
        }
        
        // Vollständiger Reset beim Orientierungswechsel
        function resetVideoContainer() {
            const video = document.querySelector('#qr-reader video');
            const qrReader = document.querySelector('#qr-reader');
            const scanRegion = document.querySelector('#qr-reader__scan_region');
            
            if (video) {
                video.style.cssText = '';
                video.style.width = '100%';
                video.style.height = '100%';
                video.style.objectFit = 'cover';
                video.style.transform = 'none';
                video.style.zoom = '1';
                video.style.scale = '1';
            }
            
            if (qrReader) {
                qrReader.style.cssText = '';
                qrReader.style.width = '100%';
                qrReader.style.height = '100%';
                qrReader.style.zoom = '1';
                qrReader.style.scale = '1';
            }
            
            if (scanRegion) {
                scanRegion.style.cssText = '';
                scanRegion.style.width = '100%';
                scanRegion.style.height = '100%';
                scanRegion.style.zoom = '1';
                scanRegion.style.scale = '1';
            }
            
            console.log('Video container reset complete');
        }

        // Start scanner when page loads
        window.addEventListener('load', () => {
            currentOrientation = isLandscape() ? 'landscape' : 'portrait';
            
            // Starte Scanner in JEDER Orientierung
            console.log('Starting scanner in', currentOrientation, 'mode');
            setTimeout(initScanner, 100);
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (html5QrCode) {
                html5QrCode.stop().catch(err => {
                    console.error('Error stopping scanner on unload:', err);
                });
            }
        });

        // Handle page visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.pause();
                }
            } else {
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.resume();
                }
            }
        });
        
        // Stoppt den Scanner (für Portrait-Modus)
        async function stopScanner() {
            if (html5QrCode) {
                try {
                    if (html5QrCode.isScanning) {
                        await html5QrCode.stop();
                        console.log('Scanner stopped for portrait mode');
                    }
                } catch (e) {
                    console.warn('Error stopping scanner:', e);
                }
            }
            // Scanner-Container verstecken
            document.getElementById('scanner-container').style.display = 'none';
        }

        // Handle orientation change - WICHTIG für Android Landscape Fix
        let orientationChangeTimeout = null;
        
        function handleOrientationChange() {
            const newOrientation = isLandscape() ? 'landscape' : 'portrait';
            
            console.log('Orientation change detected:', currentOrientation, '->', newOrientation);
            
            if (currentOrientation !== newOrientation) {
                currentOrientation = newOrientation;
                
                // Debounce: Warte kurz, da resize/orientationchange mehrfach feuern kann
                if (orientationChangeTimeout) {
                    clearTimeout(orientationChangeTimeout);
                }
                
                orientationChangeTimeout = setTimeout(async () => {
                    // Vollständiger Reset BEVOR Scanner neu gestartet wird
                    resetVideoContainer();
                    
                    if (isLandscape()) {
                        // Wechsel zu Landscape: Scanner starten
                        console.log('Switched to landscape - starting scanner...');
                        document.getElementById('loading').style.display = 'block';
                        await restartScanner();
                    } else {
                        // Wechsel zu Portrait: Scanner stoppen
                        console.log('Switched to portrait - stopping scanner...');
                        await stopScanner();
                    }
                }, 500);
            } else if (isLandscape()) {
                // Auch ohne Orientierungsänderung: Video-Fix anwenden (nur im Landscape)
                setTimeout(() => {
                    resetVideoContainer();
                    fixVideoOrientation();
                }, 100);
            }
        }
        
        // Orientierungsänderung erkennen (mehrere Events für Kompatibilität)
        window.addEventListener('orientationchange', handleOrientationChange);
        window.addEventListener('resize', handleOrientationChange);
        
        // Screen Orientation API (moderner, aber nicht überall verfügbar)
        if (screen.orientation) {
            screen.orientation.addEventListener('change', handleOrientationChange);
        }
    </script>
</body>
</html>
