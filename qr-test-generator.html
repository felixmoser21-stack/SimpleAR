<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Code Test Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: monospace;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #qr-output {
            margin-top: 30px;
            text-align: center;
            display: none;
        }

        #qr-code {
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            font-size: 13px;
            color: #555;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .preset-btn {
            padding: 10px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }

        .preset-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .download-btn {
            margin-top: 15px;
            background: #28a745;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔲 QR-Code Test Generator</h1>
        <p class="subtitle">Erstellen Sie Test-QR-Codes für die AR-Anwendung</p>

        <div class="input-group">
            <label>Preset auswählen:</label>
            <div class="preset-buttons">
                <button class="preset-btn" onclick="loadPreset('simple')">Einfacher Text</button>
                <button class="preset-btn" onclick="loadPreset('json')">JSON Daten</button>
                <button class="preset-btn" onclick="loadPreset('url')">URL</button>
                <button class="preset-btn" onclick="loadPreset('user')">User Info</button>
            </div>
        </div>

        <div class="input-group">
            <label for="qr-content">QR-Code Inhalt:</label>
            <textarea id="qr-content" placeholder='z.B. {"id": "12345", "type": "marker", "name": "Test"}'></textarea>
        </div>

        <div class="input-group">
            <label for="qr-size">Größe (px):</label>
            <select id="qr-size">
                <option value="200">Klein (200x200)</option>
                <option value="300" selected>Mittel (300x300)</option>
                <option value="400">Groß (400x400)</option>
                <option value="500">Sehr Groß (500x500)</option>
            </select>
        </div>

        <button onclick="generateQR()">QR-Code Generieren</button>

        <div id="qr-output">
            <h3>Ihr QR-Code:</h3>
            <div id="qr-code"></div>
            <button class="download-btn" onclick="downloadQR()">Als PNG herunterladen</button>
        </div>

        <div class="info-box">
            <strong>💡 Hinweis:</strong> Der generierte QR-Code kann mit der AR-App gescannt werden. 
            Die Daten werden in <code>window.QR_CODE_DATA</code> gespeichert und sind in Unity verfügbar.
        </div>
    </div>

    <!-- QRCode.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script>
        let qrCode = null;

        const presets = {
            simple: 'Test QR-Code für AR-Anwendung',
            json: JSON.stringify({
                id: '12345',
                type: 'marker',
                name: 'Test Marker',
                timestamp: new Date().toISOString()
            }, null, 2),
            url: 'https://example.com/ar-content/marker-123',
            user: JSON.stringify({
                userId: 'user_' + Math.random().toString(36).substr(2, 9),
                sessionId: Date.now(),
                permissions: ['ar_view', 'ar_interact']
            }, null, 2)
        };

        function loadPreset(type) {
            document.getElementById('qr-content').value = presets[type];
        }

        function generateQR() {
            const content = document.getElementById('qr-content').value.trim();
            const size = parseInt(document.getElementById('qr-size').value);

            if (!content) {
                alert('Bitte geben Sie einen Inhalt für den QR-Code ein.');
                return;
            }

            // Clear previous QR code
            const qrContainer = document.getElementById('qr-code');
            qrContainer.innerHTML = '';

            // Generate new QR code
            qrCode = new QRCode(qrContainer, {
                text: content,
                width: size,
                height: size,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });

            // Show output
            document.getElementById('qr-output').style.display = 'block';

            // Scroll to QR code
            setTimeout(() => {
                qrContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        function downloadQR() {
            const canvas = document.querySelector('#qr-code canvas');
            if (!canvas) {
                alert('Bitte generieren Sie zuerst einen QR-Code.');
                return;
            }

            // Convert canvas to blob and download
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'qr-code-' + Date.now() + '.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        }

        // Load default preset on page load
        window.addEventListener('load', () => {
            loadPreset('json');
        });
    </script>
</body>
</html>
